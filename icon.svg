<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="連線節點建議">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16224a"/>
      <stop offset="1" stop-color="#070b16"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5ee1a6"/>
      <stop offset="1" stop-color="#7ff0d0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#bg)"/>

  <!-- Signal arcs radiating from the node: reach, measured. -->
  <g fill="none" stroke="url(#arc)" stroke-linecap="round">
    <path d="M150 362a150 150 0 0 1 212 0" stroke-width="26" opacity="0.28"/>
    <path d="M186 326a99 99 0 0 1 140 0" stroke-width="26" opacity="0.6"/>
    <path d="M222 290a48 48 0 0 1 68 0" stroke-width="26"/>
  </g>

  <circle cx="256" cy="372" r="30" fill="#5ee1a6"/>
</svg>
