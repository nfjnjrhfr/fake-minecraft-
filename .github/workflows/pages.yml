# Publishes docs/ as a GitHub Pages site.
#
# Pages cannot be switched on from here: creating a Pages site is not
# something the Actions token is allowed to do ("Resource not accessible by
# integration"). So this checks first, and if Pages has not been enabled it
# says so and stops, rather than failing every push over a repository
# setting. Enable it once under Settings -> Pages, with Source set to
# "GitHub Actions", and this deploys from then on.
name: Deploy docs to Pages

on:
  push:
    branches:
      - main
      - claude/vpn-encryption-tunnel-jrknfc
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the recommendation maths
        run: node docs/logic.test.mjs

      - name: Is Pages enabled for this repository?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages is not enabled::Open Settings -> Pages \
              and set Source to \"GitHub Actions\". This workflow will then \
              publish docs/ to https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          fi

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: docs

      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
