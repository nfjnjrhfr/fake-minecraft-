# Publishes docs/ to the gh-pages branch, which is where Pages serves the
# site from. Pushing that branch is what switched Pages on in the first
# place, so deploying through it keeps publishing and configuration in
# agreement -- actions/deploy-pages would only work if the source were
# changed to "GitHub Actions" instead.
name: Publish docs to gh-pages

on:
  push:
    branches:
      - main
      - claude/vpn-encryption-tunnel-jrknfc
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # A broken calculation must not reach the published page.
      - name: Check the recommendation maths
        run: node docs/logic.test.mjs

      - name: Publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          site="$(mktemp -d)"
          cp docs/index.html docs/manifest.webmanifest docs/sw.js "$site/"
          cp docs/icon.svg docs/icon-180.png docs/icon-192.png docs/icon-512.png "$site/"
          # Without this, Pages runs the files through Jekyll.
          touch "$site/.nojekyll"

          cd "$site"
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site from ${GITHUB_SHA:0:7}"
          # gh-pages holds only generated output, so replacing it wholesale is
          # the point rather than a loss of history.
          git push -q --force \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
