<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="開玉">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>開玉 — 上山採玉模擬</title>
<style>
/* ===== 開玉 — 樣式 ===== */
:root{
  --bg:#0c1014; --bg2:#121820; --panel:#161d26; --panel2:#1c2531;
  --line:#26303d; --text:#e6edf3; --dim:#8b9aa9;
  --jade:#3fd6a4; --jade-d:#1d6b53; --gold:#e8c46a; --red:#ff6b6b; --blue:#5db2ff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:radial-gradient(1200px 700px at 70% -10%, #17302b 0%, var(--bg) 55%) fixed;
  color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:14px; line-height:1.55;
}
#app{max-width:1400px;margin:0 auto;padding:12px 16px 60px}

/* ---- 頂欄 ---- */
#topbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.brand{display:flex;gap:12px;align-items:center;min-width:210px}
.logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--jade),var(--jade-d));color:#04140f;
  font-size:24px;font-weight:800;box-shadow:0 0 20px rgba(63,214,164,.25)}
.brand h1{margin:0;font-size:20px;letter-spacing:3px}
.brand small{color:var(--dim);letter-spacing:1px}
.stats{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:5px 11px;min-width:88px}
.stat b{display:block;font-size:15px}
.stat span{color:var(--dim);font-size:11px;letter-spacing:1px}
.topbtns{display:flex;gap:8px;flex-wrap:wrap}

/* ---- 分頁 ---- */
.tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.tab{background:var(--panel);border:1px solid var(--line);color:var(--dim);
  padding:9px 18px;border-radius:10px;cursor:pointer;font-size:14px;transition:.15s}
.tab:hover{color:var(--text);border-color:#3a4b5e}
.tab.on{background:linear-gradient(180deg,#2a4a41,#1b3630);color:var(--jade);
  border-color:var(--jade-d);box-shadow:0 0 14px rgba(63,214,164,.15)}
.tab .badge{background:var(--gold);color:#2a1f00;border-radius:8px;padding:0 6px;margin-left:6px;font-size:11px}

/* ---- 通用 ---- */
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  padding:7px 14px;border-radius:9px;cursor:pointer;font-size:13px;font-family:inherit;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--jade-d);background:#22303c}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#2f7d63,#1d5744);border-color:#37a37f;color:#eafff7;font-weight:600}
.btn.gold{background:linear-gradient(180deg,#8a6f2a,#5f4b16);border-color:#b9953f;color:#fff6dd}
.btn.danger{border-color:#5b2b2b;color:#ffb4b4}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
.grid{display:grid;gap:12px}
.cols2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.cols3{grid-template-columns:repeat(auto-fill,minmax(270px,1fr));align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h3{margin:0 0 8px;font-size:15px;letter-spacing:1px}
.card h3 .sub{color:var(--dim);font-size:12px;font-weight:400;letter-spacing:0}
.muted{color:var(--dim)}
.tiny{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tagline{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tag{background:#1d2733;border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-size:11px;color:var(--dim)}
.tag.j{color:var(--jade);border-color:var(--jade-d)}
.tag.g{color:var(--gold);border-color:#6b5a25}
.tag.r{color:var(--red);border-color:#5b2b2b}
.tag.b{color:var(--blue);border-color:#274a6b}
.bar{height:7px;background:#0c1218;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--jade-d),var(--jade))}
.bar.red i{background:linear-gradient(90deg,#7a2b2b,var(--red))}
.bar.gold i{background:linear-gradient(90deg,#7a5f1c,var(--gold))}
hr{border:0;border-top:1px solid var(--line);margin:10px 0}

/* ---- 礦場 ---- */
.minewrap{display:grid;grid-template-columns:280px 1fr 250px;gap:12px;align-items:start}
@media(max-width:1100px){.minewrap{grid-template-columns:1fr}}
#mineCanvas{width:100%;background:#05070a;border:1px solid var(--line);border-radius:12px;
  display:block;cursor:crosshair;image-rendering:pixelated}
.toolbtn{display:flex;gap:8px;align-items:center;width:100%;text-align:left;margin-bottom:5px;
  background:var(--panel2);border:1px solid var(--line);color:var(--text);
  padding:7px 9px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px}
.toolbtn:hover:not(:disabled){border-color:var(--jade-d)}
.toolbtn.on{border-color:var(--gold);background:#2a2519;box-shadow:0 0 10px rgba(232,196,106,.15)}
.toolbtn:disabled{opacity:.35;cursor:not-allowed}
.toolbtn .ico{font-size:18px;width:24px;text-align:center}
.toolbtn .meta{color:var(--dim);font-size:11px}
.wrk{border:1px solid var(--line);border-radius:9px;padding:7px 9px;margin-bottom:6px;cursor:pointer;background:var(--panel2)}
.wrk.on{border-color:var(--jade);background:#1a2e28}
.wrk.hurt{opacity:.5}
.cellinfo{font-family:ui-monospace,monospace;font-size:12px;color:var(--gold);min-height:20px}

/* ---- 石頭卡 ---- */
.stone{background:linear-gradient(160deg,#1a2530,#141b23);border:1px solid var(--line);
  border-radius:12px;padding:11px;position:relative;overflow:hidden}
.stone.open{border-color:var(--jade-d);box-shadow:inset 0 0 30px rgba(63,214,164,.07)}
.stone.polished{border-color:var(--gold);box-shadow:inset 0 0 30px rgba(232,196,106,.09)}
.stone .kg{position:absolute;top:9px;right:11px;color:var(--gold);font-weight:700}
.stone .name{font-weight:600;letter-spacing:1px}
.stone .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px;margin:6px 0}
.stone .kv b{color:var(--dim);font-weight:400}
.stone .acts{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.est{font-size:13px;color:var(--jade)}

/* ---- 日誌 ---- */
.logline{border-left:3px solid var(--line);padding:3px 0 3px 9px;margin-bottom:3px;font-size:13px}
.logline .d{color:var(--dim);font-size:11px;margin-right:6px}
.logline.ok{border-color:var(--jade)}
.logline.bad{border-color:var(--red)}
.logline.warn{border-color:var(--gold)}
.logline.day{border-color:var(--blue);color:var(--blue)}
.logline.go{border-color:#6a5acd}

/* ---- toast / modal ---- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toastmsg{background:#0f1a22;border:1px solid var(--jade-d);color:var(--text);
  padding:9px 18px;border-radius:24px;box-shadow:0 8px 30px rgba(0,0,0,.6);animation:pop .25s}
.toastmsg.bad{border-color:#6b2b2b}
.toastmsg.gold{border-color:#7a6224}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
#modal{position:fixed;inset:0;background:rgba(3,6,9,.78);display:grid;place-items:center;z-index:70;padding:20px}
#modal.hidden{display:none}
.modalbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:18px;max-width:820px;width:100%;max-height:86vh;overflow:auto}
.checkrow{display:flex;gap:10px;align-items:center;border:1px solid var(--line);
  border-radius:9px;padding:7px 10px;margin-bottom:5px;cursor:pointer;background:var(--panel2)}
.checkrow.on{border-color:var(--jade);background:#182a25}
.site{cursor:pointer;transition:.15s}
.site:hover{border-color:var(--jade-d);transform:translateY(-2px)}
.big{font-size:26px;font-weight:800;letter-spacing:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:5px 7px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--dim);font-weight:400;font-size:12px}

/* ---- 坑口（3D 入口） ---- */
.enter3d{text-align:center;padding:26px 18px;
  background:radial-gradient(600px 300px at 50% 0%,#1d3a33,#111820 70%)}
.e3-art{width:120px;height:120px;margin:0 auto 12px;border-radius:50%;
  display:grid;place-items:center;font-size:52px;
  background:radial-gradient(circle at 50% 35%,#28483f,#080c10 70%);
  border:1px solid var(--jade-d);box-shadow:0 0 50px rgba(63,214,164,.18) inset,0 0 30px rgba(0,0,0,.6)}
.big-btn{font-size:16px;padding:12px 26px;margin:12px 0 4px}
.keys{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;margin-top:10px;
  color:var(--dim);font-size:12px}
kbd{background:#0e151c;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
  padding:1px 6px;margin:0 2px;font-family:ui-monospace,monospace;color:var(--text)}

/* ---- 第一人稱全螢幕 ---- */
#fpwrap{position:fixed;inset:0;z-index:200;background:#000}
#fpcv{width:100%;height:100%;display:block;cursor:none;image-rendering:pixelated}
#fphud{position:absolute;inset:0;pointer-events:none;
  font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;color:#e6edf3;text-shadow:0 2px 6px #000}
.fp-top{position:absolute;top:14px;left:18px;display:flex;gap:20px;font-size:13px;
  background:rgba(5,9,12,.5);padding:6px 14px;border-radius:20px;border:1px solid #26303d}
#fpmap{position:absolute;top:14px;right:18px;border:1px solid #26303d;border-radius:10px;display:none}
#fp-msg{position:absolute;top:22%;left:0;right:0;text-align:center;font-size:20px;
  color:#ffe27a;opacity:0;transition:opacity .2s;font-weight:600}
.fp-target{position:absolute;top:56%;left:0;right:0;text-align:center;font-size:13px;color:#cfe;display:none}
.fp-hpbar{display:inline-block;width:130px;height:6px;background:rgba(0,0,0,.6);
  border:1px solid #26303d;border-radius:4px;overflow:hidden;vertical-align:middle;margin-left:6px}
.fp-hpbar i{display:block;height:100%;background:linear-gradient(90deg,#7a2b2b,#e8c46a)}
.fp-bottom{position:absolute;left:18px;bottom:16px;display:flex;gap:18px;align-items:flex-end}
#fp-worker{background:rgba(5,9,12,.5);padding:8px 14px;border-radius:12px;border:1px solid #26303d;min-width:190px}
.fp-bar{height:7px;background:#0c1218;border:1px solid #26303d;border-radius:5px;overflow:hidden;margin:4px 0}
.fp-bar i{display:block;height:100%;background:linear-gradient(90deg,#1d6b53,#3fd6a4)}
#fp-tools{display:flex;flex-wrap:wrap;gap:5px;max-width:60vw}
.fp-tool{background:rgba(5,9,12,.55);border:1px solid #26303d;border-radius:8px;padding:3px 9px;font-size:12px}
.fp-tool.on{border-color:#e8c46a;color:#ffe27a;background:rgba(60,48,16,.7)}
.fp-tool.off{opacity:.32}
.fp-help{position:absolute;right:18px;bottom:16px;font-size:11px;color:#8b9aa9;max-width:38vw;text-align:right}
#fphud .tiny{font-size:11px;color:#8b9aa9}

/* ---- 切石動畫 ---- */
.fxwrap{position:fixed;inset:0;z-index:300;background:rgba(2,4,6,.82);cursor:pointer}
.fxcv{width:100%;height:100%;display:block}
.fxcap{position:absolute;left:0;right:0;bottom:16%;text-align:center;opacity:0;transition:opacity .5s}
.fxbig{font-size:40px;font-weight:800;letter-spacing:6px;text-shadow:0 0 30px currentColor,0 0 8px rgba(255,255,255,.75),0 2px 4px #000}
.fxsub{color:#e6edf3;letter-spacing:4px;margin-top:6px}

/* ---- 觸控操作（iPad / 手機） ---- */
#fpwrap{touch-action:none}
#fp-touch{position:absolute;inset:0;pointer-events:none}
#joy{position:absolute;left:26px;bottom:90px;width:110px;height:110px;border-radius:50%;
  border:2px solid rgba(63,214,164,.4);background:rgba(5,9,12,.35);pointer-events:auto;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#3fd6a4,#1d6b53);opacity:.85;display:block}
#btn-dig{position:absolute;right:30px;bottom:96px;width:92px;height:92px;border-radius:50%;
  font-size:38px;border:2px solid #b9953f;color:#fff6dd;
  background:radial-gradient(circle at 35% 30%,#8a6f2a,#4a3a10);pointer-events:auto;touch-action:none}
#btn-dig:active{transform:scale(.93)}
#fp-actions{position:absolute;right:12px;top:64px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
#fp-actions button{background:rgba(5,9,12,.6);border:1px solid #26303d;color:#e6edf3;
  border-radius:10px;padding:8px 12px;font-size:14px;font-family:inherit}
#fp-actions button.quit{border-color:#5b2b2b;color:#ffb4b4}
@media (pointer:coarse){
  .keys{display:none}
  .enter3d p.muted{font-size:13px}
}

/* ---- 自家礦權 ---- */
.mine-owned{border-color:var(--jade-d);box-shadow:inset 0 0 26px rgba(63,214,164,.06)}

/* ---- 固定畫面（防跳動） ---- */
html{overscroll-behavior:none}
button,.btn,.tab,.checkrow,.wrk,.toolbtn,.site{touch-action:manipulation}
body.locked{position:fixed;inset:0;width:100%;height:100%;overflow:hidden}
body.locked #app{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#lockBtn.on{border-color:var(--gold);color:var(--gold)}

/* ---- 隊友狀態列 ---- */
.fp-mate{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:1px 0}
.fp-mate span:last-child{color:#8b9aa9}

/* ---- 變異工人 ---- */
.card.mutant{border-color:#4a6b32;box-shadow:inset 0 0 26px rgba(120,180,80,.08)}

/* ---- 民兵警示條 ---- */
.alertbar{display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:linear-gradient(90deg,#3a1518,#241014);border:1px solid #6b2b2b;
  border-radius:10px;padding:10px 14px;margin-bottom:12px;color:#ffb4b4;
  animation:pulsebar 1.6s infinite}
.alertbar.army{border-color:#8a5a1f;color:#ffd9a0;background:linear-gradient(90deg,#3a2a12,#241a0e)}
@keyframes pulsebar{0%,100%{box-shadow:0 0 0 rgba(255,80,80,0)}50%{box-shadow:0 0 18px rgba(255,80,80,.25)}}

</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <span class="logo">翡</span>
      <div>
        <h1>開玉</h1>
        <small>上山．開礦．相玉．一刀定生死</small>
      </div>
    </div>
    <div id="stats" class="stats"></div>
    <div class="topbtns">
      <button class="btn primary" data-act="endday">結束這一天 ⏭</button>
      <button class="btn ghost" data-act="fullscreen" id="fsBtn">⛶ 全螢幕</button>
      <button class="btn ghost" data-act="lockscreen" id="lockBtn">🔓 固定畫面</button>
      <button class="btn ghost" data-act="save">存檔</button>
      <button class="btn ghost danger" data-act="reset">重新開始</button>
    </div>
  </header>

  <nav id="tabs" class="tabs"></nav>

  <main id="view"></main>

  <div id="toast"></div>
  <div id="modal" class="hidden"><div class="modalbox" id="modalBox"></div></div>
</div>

<script>
/* ============================================================
   開玉 — 資料層
   場口、設備、消耗品、玉石品質表、工人名冊
   ============================================================ */
(function (global) {
  'use strict';

  /* ---------- 玉石品質表 ---------- */

  // 種（質地）：越後面越老、越透
  const ZHONG = [
    { id: 'zhuan', name: '磚頭料', base: 40, desc: '不透、粗粒，基本沒水頭' },
    { id: 'dou', name: '豆種', base: 320, desc: '顆粒明顯，水頭短' },
    { id: 'nuo', name: '糯種', base: 1400, desc: '像糯米湯，半透' },
    { id: 'nuobing', name: '糯冰種', base: 4200, desc: '糯中帶冰，通透度不錯' },
    { id: 'bing', name: '冰種', base: 16000, desc: '冰塊感，起膠' },
    { id: 'gaobing', name: '高冰種', base: 48000, desc: '接近玻璃，剛性強' },
    { id: 'boli', name: '玻璃種', base: 130000, desc: '透明起熒，極品質地' }
  ];

  // 色
  const COLOR = [
    { id: 'wuse', name: '無色白', mult: 1.0 },
    { id: 'piaohua', name: '飄花', mult: 1.35 },
    { id: 'doulv', name: '豆綠', mult: 1.2 },
    { id: 'danlv', name: '淡綠', mult: 1.45 },
    { id: 'qingshui', name: '晴水', mult: 1.9 },
    { id: 'lanshui', name: '藍水', mult: 1.7 },
    { id: 'huangfei', name: '黃翡', mult: 1.55 },
    { id: 'hongfei', name: '紅翡', mult: 2.1 },
    { id: 'mocui', name: '墨翠', mult: 1.8 },
    { id: 'ziluolan', name: '紫羅蘭', mult: 2.4 },
    { id: 'yanglv', name: '陽綠', mult: 3.6 },
    { id: 'zhengyang', name: '正陽綠', mult: 6.2 },
    { id: 'diwang', name: '帝王綠', mult: 15.0 }
  ];

  // 皮殼（原石外皮）— 給玩家的線索
  const SKIN = [
    { id: 'heiwu', name: '黑烏砂', hint: '皮下常出高綠，但也常滿裂' },
    { id: 'huangyan', name: '黃鹽砂', hint: '砂發翻得起，種水通常不差' },
    { id: 'baiyan', name: '白鹽砂', hint: '皮薄肉細，出冰的機會高' },
    { id: 'hongwu', name: '紅霧皮', hint: '霧色重，肉容易偏黃' },
    { id: 'tiehei', name: '鐵鏽皮', hint: '皮厚難看漲，賭性大' },
    { id: 'huangla', name: '黃臘皮', hint: '常帶糯化，穩但難出高貨' }
  ];

  /* ---------- 場口（礦區） ---------- */
  // zhongBias / colorBias：正值把該場口的出貨往好料推
  const SITES = [
    {
      id: 'huika', name: '會卡', alt: 480, fee: 4000,
      road: 3, danger: 0.10, water: 0.15, hardness: 0.8,
      zhongBias: -0.15, colorBias: -0.10, crackBias: 0.05, density: 0.16, sizeMul: 1.15,
      skins: ['huangla', 'hongwu', 'tiehei'],
      desc: '入門場口，皮厚肉粗，量大但價低。新隊伍練手的地方。'
    },
    {
      id: 'damakan', name: '大馬坎', alt: 620, fee: 12000,
      road: 3, danger: 0.14, water: 0.30, hardness: 1.0,
      zhongBias: 0.0, colorBias: 0.05, crackBias: 0.0, density: 0.14, sizeMul: 0.95,
      skins: ['hongwu', 'huangyan', 'huangla'],
      desc: '黃霧紅霧出名，容易出黃翡紅翡。水坑多，記得帶抽水機。'
    },
    {
      id: 'muna', name: '木那', alt: 900, fee: 60000,
      road: 2, danger: 0.22, water: 0.20, hardness: 1.25,
      zhongBias: 0.12, colorBias: 0.10, crackBias: -0.05, density: 0.12, sizeMul: 1.05,
      skins: ['baiyan', 'huangyan', 'heiwu'],
      desc: '種老色陽、點狀棉是招牌。山路難行，圍岩偏硬。'
    },
    {
      id: 'moxisha', name: '莫西沙', alt: 1050, fee: 130000,
      road: 2, danger: 0.26, water: 0.35, hardness: 1.45,
      zhongBias: 0.26, colorBias: -0.05, crackBias: -0.02, density: 0.10, sizeMul: 0.8,
      skins: ['baiyan', 'huangyan'],
      desc: '出高透明度的第一場口。塊頭小、圍岩極硬，切漲一刀吃三年。'

   開玉 — 第一人稱 3D 坑道引擎
   自寫軟體光線投射（raycasting）：只看得見燈照到的前方，
   坑道要跟著地上的導引線走，看不到完整地圖。
   ============================================================ */
(function (global) {
  'use strict';
  const { EQUIP, SITES, SUPPLY } = global.DATA;
  const J = global.JADE;

  const MS = 56;                 // 地圖格數
  const OPEN = 0, ROCK = 1, HARD = 2, VEIN = 3, BED = 4;
  const TYPE = {
    1: { name: '圍岩', hp: 42, hard: 1.0, rgb: [96, 102, 112] },
    2: { name: '硬岩', hp: 96, hard: 1.75, rgb: [64, 68, 76] },
    3: { name: '玉脈帶', hp: 60, hard: 1.2, rgb: [62, 122, 100] },
    4: { name: '岩盤', hp: 1e9, hard: 99, rgb: [40, 42, 48] }

  const idx = (x, y) => y * MS + x;

  /* ================= 產生坑道 ================= */
  function genLevel(S, site) {
    const map = new Uint8Array(MS * MS).fill(ROCK);
    const hp = new Float32Array(MS * MS);
    const wet = new Uint8Array(MS * MS);
    const seen = new Uint8Array(MS * MS);
    const path = new Uint8Array(MS * MS);
    const nodes = {};

    for (let y = 1; y < MS - 1; y++) for (let x = 1; x < MS - 1; x++) {
      const depth = x / MS, r = Math.random();
      let t = ROCK;
      if (r < 0.16 + depth * 0.3) t = HARD;
      else if (r > 0.9 - depth * 0.14) t = VEIN;
      map[idx(x, y)] = t;
      hp[idx(x, y)] = TYPE[t].hp * (0.75 + depth * 1.0) * site.hardness;
      if (depth > 1 - site.water) wet[idx(x, y)] = 1;
    }
    for (let i = 0; i < MS; i++) { map[idx(i, 0)] = BED; map[idx(i, MS - 1)] = BED; map[idx(0, i)] = BED; map[idx(MS - 1, i)] = BED; }

    const carve = (x, y) => {
      if (x < 1 || y < 1 || x >= MS - 1 || y >= MS - 1) return;
      map[idx(x, y)] = OPEN;
    };
    const room = (x, y, r) => { for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) carve(x + i, y + j); };

    // 洞口
    let cx = 3, cy = MS >> 1;
    room(cx, cy, 2);
    const way = [];
    let dir = 0;                       // 0:+x 1:+y 2:-y
    for (let step = 0; step < 150 && cx < MS - 8; step++) {
      const r = Math.random();
      if (r < 0.24) dir = 1; else if (r < 0.48) dir = 2; else dir = 0;
      const dx = dir === 0 ? 1 : 0;
      const dy = dir === 1 ? 1 : dir === 2 ? -1 : 0;
      const nx = cx + dx, ny = Math.max(4, Math.min(MS - 5, cy + dy));
      if (dir !== 0 && Math.abs(ny - (MS >> 1)) > 14) continue;
      cx = Math.min(MS - 5, nx); cy = ny;
      carve(cx, cy); carve(cx, cy - 1);            // 坑道高一點好走
      path[idx(cx, cy)] = 1;
      way.push([cx, cy]);
      if (Math.random() < 0.12) room(cx, cy, 1);    // 偶爾一個小硐室
    }
    // 開採面
    room(cx, cy, 2);
    for (let j = -3; j <= 3; j++) for (let i = -3; i <= 3; i++) {
      const x = cx + i, y = cy + j;
      if (x > 0 && y > 0 && x < MS - 1 && y < MS - 1 && map[idx(x, y)] !== OPEN && map[idx(x, y)] !== BED) {

      }
    }

    for (let y = 1; y < MS - 1; y++) for (let x = 1; x < MS - 1; x++) {
      const t = map[idx(x, y)];
      if (t === OPEN || t === BED) continue;

        const nx = x + i, ny = y + j;
        if (nx > 0 && ny > 0 && nx < MS && ny < MS && map[idx(nx, ny)] === OPEN) near = true;
      }
      const depth = x / MS;
      let p = site.density * (0.3 + depth * 1.6) * (t === VEIN ? 2.4 : t === HARD ? 1.0 : 0.55);
      if (!near) p *= 0.45;
      p = Math.min(p, 0.3);

        nodes[idx(x, y)] = J.makeStone(site, { sizeMul: 0.6 + depth * 0.9, luck: (depth - 0.45) * 0.3 });
      }
    }

    return { map, hp, wet, seen, path, nodes, way, spawn: { x: 3.5, y: (MS >> 1) + 0.5 }, face: { x: cx, y: cy } };
  }

  /* ================= 開工 ================= */
  function start(S, siteId, teamIds) {
    const site = SITES.find(s => s.id === siteId);
    const lv = genLevel(S, site);
    const sess = {
      site, siteId, lv,
      team: teamIds.slice(),
      active: teamIds[0] || null,
      tool: firstTool(S),
      stones: [],
      pumpOn: false,
      lightOn: hasWorking(S, 'headlamp') || hasWorking(S, 'floodlight'),
      timbers: 0, dugCount: 0, actions: 0, collapsed: 0,
      accum: { pump: 0, light: 0, lamp: 0 },
      player: { x: lv.spawn.x, y: lv.spawn.y, ang: 0, bob: 0, vx: 0, vy: 0 },
      log: [], over: false
    };
    markSeen(sess);
    return sess;
  }

  function firstTool(S) {
    const order = ['pickaxe', 'chisel', 'shovel', 'prybar', 'sledge', 'jackhammer', 'excavator', 'dynamite_kit'];
    for (const id of order) if (hasWorking(S, id)) return id;
    return null;
  }
  function hasWorking(S, id) { const e = S.equip[id]; return !!(e && e.qty > 0 && e.dur > 0); }
  function worker(S, id) { return S.workers.find(w => w.id === id); }
  function skillName(k) { return { mine: '採礦', blast: '爆破', mech: '機械', eye: '相玉' }[k] || k; }
  function coverage(S, sess, id) {
    const e = S.equip[id];
    if (!e || e.qty <= 0 || e.dur <= 0) return 0;
    return Math.min(1, e.qty / Math.max(1, sess.team.length));
  }
  function bestSkill(S, sess, key) {
    return sess.team.map(id => worker(S, id)).filter(Boolean).reduce((m, x) => Math.max(m, x.skill[key] || 0), 0);
  }

  function lightRadius(S, sess) {
    let r = 3.5;
    if (sess.lightOn && hasWorking(S, 'headlamp')) r = Math.max(r, 3.5 + EQUIP.headlamp.light * 2.6);
    if (sess.lightOn && hasWorking(S, 'floodlight') && hasWorking(S, 'generator')) r = Math.max(r, 3.5 + EQUIP.floodlight.light * 2.6);
    if (S.weather.id === 'fog') r -= 2;
    return Math.max(2.5, r);
  }

  function markSeen(sess) {
    const p = sess.player, lv = sess.lv, R = 5;
    for (let j = -R; j <= R; j++) for (let i = -R; i <= R; i++) {
      const x = Math.floor(p.x) + i, y = Math.floor(p.y) + j;
      if (x > 0 && y > 0 && x < MS && y < MS) lv.seen[idx(x, y)] = 1;
    }
  }

  /* ================= 工具可用性 ================= */
  function canUse(S, sess, toolId) {
    const eq = EQUIP[toolId];
    if (!eq || !eq.tool) return { ok: false, why: '沒有這個工具' };
    if (!hasWorking(S, toolId)) return { ok: false, why: eq.name + ' 沒有或已損壞' };
    const t = eq.tool;
    for (const need of (t.needs || [])) if (!hasWorking(S, need)) return { ok: false, why: '需要 ' + EQUIP[need].name };
    if (t.use) for (const k in t.use) if ((S.supply[k] || 0) < t.use[k]) return { ok: false, why: '缺 ' + SUPPLY[k].name };
    if (t.fuel) for (const k in t.fuel) if ((S.supply[k] || 0) < t.fuel[k]) return { ok: false, why: '缺 ' + SUPPLY[k].name };
    if (t.skill) {
      const w = worker(S, sess.active);
      if (!w) return { ok: false, why: '沒有選定工人' };

  function aim(sess, reach) {

    const dx = Math.cos(p.ang), dy = Math.sin(p.ang);
    for (let d = 0.15; d < (reach || 2.0); d += 0.06) {

  function accident(S, sess, t, w) {
    const helm = coverage(S, sess, 'helmet'), ropeC = coverage(S, sess, 'rope');

    p *= 1.5 - helm * 0.5;

    const severe = Math.random() < 0.35 * (1 - coverage(S, sess, 'harness') * EQUIP.harness.safety);
    let days = severe ? 3 + Math.floor(Math.random() * 4) : 1 + Math.floor(Math.random() * 2);

  /* ================================================================

    const particles = [];
    const swing = { t: 1, dur: 0.42, hit: false };

    /* ---- 隊友 NPC：散開找料、自動開挖 ---- */
    function mkNpc(wid, x, y) {
      return { wid, x, y, ang: 0, phase: Math.random() * 6, state: 'idle', path: null, pi: 0, target: 0, claim: 0, cool: 0.5 + Math.random() };

    (function syncNpcs() {

        let px = lv.spawn.x, py = lv.spawn.y;
        while (si < spots.length) {
          const cx = Math.floor(lv.spawn.x) + spots[si][0], cy = Math.floor(lv.spawn.y) + spots[si][1];
          si++;
          if (lv.map[idx(cx, cy)] === OPEN) { px = cx + 0.5; py = cy + 0.5; break; }
        }
        sess.npcs.push(mkNpc(id, px, py));
      });
      // 自己不該同時是 NPC（重複進出坑道時）
      sess.npcs = sess.npcs.filter(n => n.wid !== sess.active);
    })();

    function release(npc) {
      if (npc.claim) { delete sess.claims[npc.claim]; npc.claim = 0; }
      npc.path = null; npc.target = 0;
    }

    // BFS：找最值錢又沒人認領的岩壁（有料 > 玉脈 > 一般），回傳走過去的路徑
    function findJob(npc) {
      const lv = sess.lv;
      const sx = Math.floor(npc.x), sy = Math.floor(npc.y);
      const start = idx(sx, sy);
      if (lv.map[start] !== OPEN) return false;
      const prev = new Map([[start, { p: -1, d: 0 }]]);
      const q = [start];
      let best = null, bestScore = -1;
      for (let qi = 0; qi < q.length && qi < 900; qi++) {
        const c = q[qi], cx = c % MS, cy = (c / MS) | 0, d = prev.get(c).d;
        for (const [ddx, ddy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nx = cx + ddx, ny = cy + ddy;
          if (nx < 1 || ny < 1 || nx >= MS - 1 || ny >= MS - 1) continue;
          const ni = idx(nx, ny), t = lv.map[ni];
          if (t === OPEN) {
            if (!prev.has(ni)) { prev.set(ni, { p: c, d: d + 1 }); q.push(ni); }
          } else if (t !== BED) {
            if (sess.claims[ni] && sess.claims[ni] !== npc.wid) continue;
            const sc = (lv.nodes[ni] ? 120 : 0) + (t === VEIN ? 8 : t === HARD ? 2 : 4) + nx * 0.15 - d * 0.6;
            if (sc > bestScore) { bestScore = sc; best = { open: c, wall: ni }; }
          }
        }
      }
      if (!best) return false;
      const path = [];
      let c = best.open;
      while (c !== -1 && c !== start) { path.push({ x: c % MS, y: (c / MS) | 0 }); c = prev.get(c).p; }
      path.reverse();
      npc.path = path; npc.pi = 0;
      npc.target = best.wall; npc.claim = best.wall;
      sess.claims[best.wall] = npc.wid;
      npc.state = 'walk';
      return true;
    }

    function npcStep(dt) {
      const lv = sess.lv;
      for (const npc of sess.npcs.slice()) {
        if (npc.state === 'flee') { fleeStep(npc, dt); continue; }
        const w = worker(S, npc.wid);
        if (!w) continue;
        // 心灰意冷的人可能趁亂抓料就跑（變異者絕對服從）
        if (!w.mutant && sess.stones.length && w.morale < 20 && Math.random() < 0.0005) {
          const n2 = defect(npc.wid, true, npc);
          if (n2) {
            const m = '💢 ' + n2.wname + ' 趁沒人注意' + (n2.stolen ? '抓了一顆 ' + n2.stolen.kg + 'kg 的料' : '') + '往洞口跑！';
            say(m); sess.log.push(m); global.GAME.log(m, 'bad');
          }
          continue;
        }
        const feared = sess.fearT > 0;
        if (w.injury > 0 || w.stam < (feared ? 2 : 10)) {
          if (feared && w.injury === 0 && w.stam <= 2) {
            // 被槍逼到累垮
            w.injury += 1;
            w.morale = Math.max(0, w.morale - 8);
            say('😵 ' + w.name + ' 撐不住，當場累垮了（傷 1 天）');
            sess.log.push(w.name + ' 被逼到累垮');
          }
          release(npc); npc.state = 'rest'; continue;
        }
        if (npc.state === 'rest') npc.state = 'idle';
        if (npc.state === 'idle') { findJob(npc); continue; }

        if (npc.state === 'walk') {
          if (lv.map[npc.target] === OPEN) { release(npc); npc.state = 'idle'; continue; }
          const tgt = npc.path && npc.path[npc.pi];
          if (!tgt) { npc.state = 'dig'; npc.cool = 0.4; continue; }
          const txc = tgt.x + 0.5, tyc = tgt.y + 0.5;
          const dx = txc - npc.x, dy = tyc - npc.y, dlen = Math.hypot(dx, dy);
          let sp = 2.2;
          if (lv.wet[idx(Math.floor(npc.x), Math.floor(npc.y))] && !sess.pumpOn) sp *= 0.5;
          if (dlen < 0.14) {
            npc.pi++;
            if (npc.pi >= npc.path.length) { npc.state = 'dig'; npc.cool = 0.4; }
          } else {
            npc.x += dx / dlen * sp * dt; npc.y += dy / dlen * sp * dt;
            npc.ang = Math.atan2(dy, dx);
            npc.phase += sp * dt * 3.2;
          }
          continue;
        }

        if (npc.state === 'dig') {
          const ti = npc.target;
          if (!ti || lv.map[ti] === OPEN || lv.map[ti] === BED) { release(npc); npc.state = 'idle'; continue; }
          const tx = ti % MS, ty = (ti / MS) | 0;
          npc.ang = Math.atan2(ty + 0.5 - npc.y, tx + 0.5 - npc.x);
          npc.phase += dt * 7;
          npc.cool -= dt;
          if (npc.cool > 0) continue;
          npc.cool = (1.15 - Math.min(0.4, (w.skill.mine || 0) * 0.04)) * (sess.fearT > 0 ? 0.78 : 1);
          const hasNode = !!lv.nodes[ti];
          const careful = hasNode && lv.hp[ti] < 35;      // 快見料就改鑿子小心敲
          const T = TYPE[lv.map[ti]];
          let dmg = (careful ? 13 : 24) * (1 + (w.skill.mine || 0) * 0.05) * S.weather.work / T.hard;
          if (w.mutant) dmg *= 1.8;
          if (lv.wet[ti] && !sess.pumpOn) dmg *= 0.4;
          lv.hp[ti] -= dmg * (0.85 + Math.random() * 0.3);
          w.stam -= (w.mutant ? 0.5 : 1) * Math.max(2, 4 - (w.skill.mine || 0) * 0.1);
          sess.actions++;
          if (lv.hp[ti] <= 0) {
            lv.map[ti] = OPEN; sess.dugCount++;
            const st = lv.nodes[ti];
            if (st) {
              const add = (careful ? 0.05 : (w.mutant ? 0.38 : 0.22)) * (0.5 + Math.random() * 0.8);
              J.addMiningCrack(st, add);
              st.note = add <= 0.05 ? '取料乾淨' : '';
              sess.stones.push(st);
              delete lv.nodes[ti];
              say('💎 ' + w.name + ' 喊：出料了！' + st.kg + 'kg');
              sess.log.push(w.name + ' 挖出 ' + st.kg + 'kg 原石');
            }
            release(npc); npc.state = 'idle';
          }
          if (Math.random() < collapseRisk(S, sess) * 0.018) {
            const m = accident(S, sess, { danger: 0 }, w);
            if (m) say(m);
          }
        }
      }
    }

    let aiAcc = 0;
    function aiTick(dt) {
      if (night) return;
      aiAcc += dt;
      while (aiAcc >= 0.12) { aiAcc -= 0.12; npcStep(0.12); }
    }


    function resize() {
      cv.width = window.innerWidth; cv.height = window.innerHeight;
      ctx.imageSmoothingEnabled = false;
    }
    resize();
    window.addEventListener('resize', resize);

    /* ---- 輸入 ---- */
    function onKey(e, down) {
      keys[e.code] = down;
      if (!down) return;
      if (e.code === 'KeyQ' || e.code === 'Escape') { if (e.code === 'KeyQ') quit(); return; }
      if (e.code === 'Space') doDig();
      if (e.code === 'KeyZ') doSleep();
      if (e.code === 'KeyX') menace();
      if (e.code === 'KeyM') showMap = !showMap;
      if (e.code === 'KeyF') { const r = toggleLight(S, sess); say(r.msg); }
      if (e.code === 'KeyP') { const r = togglePump(S, sess); say(r.msg); }
      if (e.code === 'KeyG') { const r = placeTimber(S, sess); say(r.msg); }
      if (e.code === 'KeyT') nextWorker();
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= 8) {
        const ids = Object.keys(EQUIP).filter(id => EQUIP[id].tool);
        const id = ids[n - 1];
        if (id) { const c = canUse(S, sess, id); if (c.ok) { sess.tool = id; say('換上 ' + EQUIP[id].name); hud(); } else say(c.why); }
      }
    }
    const kd = e => { if (['KeyW','KeyA','KeyS','KeyD','Space','KeyQ'].indexOf(e.code) >= 0) e.preventDefault(); onKey(e, true); };
    const ku = e => onKey(e, false);
    document.addEventListener('keydown', kd);
    document.addEventListener('keyup', ku);

    const mm = e => { if (document.pointerLockElement === cv) sess.player.ang += e.movementX * 0.0026; };
    document.addEventListener('mousemove', mm);
    cv.addEventListener('click', () => { if (document.pointerLockElement !== cv) cv.requestPointerLock(); });
    const md = e => { if (document.pointerLockElement === cv && e.button === 0) doDig(); };
    document.addEventListener('mousedown', md);

    /* ---- 觸控：左下搖桿走路、畫面拖曳轉頭、右下按住連挖 ---- */
    const touchUI = wrap.querySelector('#fp-touch');
    if (!isTouch) touchUI.style.display = 'none';
    else {
      wrap.querySelector('.fp-help').style.display = 'none';
      const joyEl = wrap.querySelector('#joy'), knob = joyEl.querySelector('i');
      const findT = (e, id) => { for (const t of e.changedTouches) if (t.identifier === id) return t; return null; };
      joyEl.addEventListener('touchstart', e => {
        e.preventDefault();
        const t = e.changedTouches[0];
        joy.id = t.identifier; joy.ox = t.clientX; joy.oy = t.clientY;
      }, { passive: false });
      joyEl.addEventListener('touchmove', e => {
        e.preventDefault();
        const t = findT(e, joy.id); if (!t) return;
        const dx = Math.max(-1, Math.min(1, (t.clientX - joy.ox) / 45));
        const dy = Math.max(-1, Math.min(1, (t.clientY - joy.oy) / 45));
        joy.f = -dy; joy.s = dx;
        knob.style.transform = 'translate(' + dx * 26 + 'px,' + dy * 26 + 'px)';
      }, { passive: false });
      const joyEnd = e => { const t = findT(e, joy.id); if (!t) return; joy.f = joy.s = 0; joy.id = null; knob.style.transform = ''; };
      joyEl.addEventListener('touchend', joyEnd);
      joyEl.addEventListener('touchcancel', joyEnd);

      cv.addEventListener('touchstart', e => { const t = e.changedTouches[0]; lookId = t.identifier; lookX = t.clientX; }, { passive: true });
      cv.addEventListener('touchmove', e => {
        e.preventDefault();
        const t = findT(e, lookId); if (!t) return;
        sess.player.ang += (t.clientX - lookX) * 0.006;
        lookX = t.clientX;
      }, { passive: false });

      const digBtn = wrap.querySelector('#btn-dig');
      digBtn.addEventListener('touchstart', e => { e.preventDefault(); digHold = true; doDig(); }, { passive: false });
      const digEnd = e => { e.preventDefault(); digHold = false; };
      digBtn.addEventListener('touchend', digEnd);
      digBtn.addEventListener('touchcancel', digEnd);

      wrap.querySelector('#fp-actions').addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        const k = b.dataset.k;
        if (k === 'tool') {
          const ids = Object.keys(EQUIP).filter(id => EQUIP[id].tool && canUse(S, sess, id).ok);
          if (!ids.length) { say('沒有能用的工具'); return; }
          const i = ids.indexOf(sess.tool);
          sess.tool = ids[(i + 1) % ids.length];
          say('換上 ' + EQUIP[sess.tool].name); hud();
        }
        else if (k === 'T') nextWorker();
        else if (k === 'F') say(toggleLight(S, sess).msg);
        else if (k === 'P') say(togglePump(S, sess).msg);
        else if (k === 'G') say(placeTimber(S, sess).msg);
        else if (k === 'M') showMap = !showMap;
        else if (k === 'Z') doSleep();
        else if (k === 'X') menace();
        else if (k === 'L') { if (global.UI && global.UI.toggleLock) { global.UI.toggleLock(); say('切換固定畫面'); } }
        else if (k === 'FS') { if (global.UI && global.UI.goFullscreen) global.UI.goFullscreen(); }
        else if (k === 'Q') quit();
      });
    }

    // 換人＝身體交換：你去接手隊友的位置，原本操控的人留在原地繼續幫挖
    function nextWorker() {
      const list = sess.team.filter(id => { const w = worker(S, id); return w && w.injury === 0; });
      if (list.length < 2) { say('沒有其他人能接手'); return; }
      const i = list.indexOf(sess.active);
      const nid = list[(i + 1) % list.length];
      if (nid === sess.active) return;
      const p = sess.player;
      sess.npcs.push(mkNpc(sess.active, p.x, p.y));
      const j = sess.npcs.findIndex(n => n.wid === nid);
      if (j >= 0) {
        const n = sess.npcs[j];
        p.x = n.x; p.y = n.y;
        if (n.claim) delete sess.claims[n.claim];
        sess.npcs.splice(j, 1);
      }
      sess.active = nid;
      const w = worker(S, nid);
      say('接手 ' + w.name + '（體力 ' + Math.round(w.stam) + '）— 原本那位留在原地繼續挖');
    }

    function say(m) { if (!m) return; msg = m; msgT = 2.6; }

    /* ---- 叛逃／偷料：變成往洞口逃跑的實體 ---- */
    function findPathTo(npc, tx, ty) {
      const lv = sess.lv;
      const sx = Math.floor(npc.x), sy = Math.floor(npc.y);
      const start = idx(sx, sy), goal = idx(tx, ty);
      const prev = new Map([[start, -1]]);
      const q = [start];
      for (let qi = 0; qi < q.length && qi < 1400; qi++) {
        const c = q[qi];
        if (c === goal) break;
        const cx = c % MS, cy = (c / MS) | 0;
        for (const [ddx, ddy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nx = cx + ddx, ny = cy + ddy;
          if (nx < 1 || ny < 1 || nx >= MS - 1 || ny >= MS - 1) continue;
          const ni = idx(nx, ny);
          if (lv.map[ni] !== OPEN || prev.has(ni)) continue;
          prev.set(ni, c); q.push(ni);
        }
      }
      const path = [];
      let c = prev.has(goal) ? goal : q[q.length - 1];
      while (c !== -1 && c !== start) { path.push({ x: c % MS, y: (c / MS) | 0 }); c = prev.get(c); }
      path.reverse();
      npc.path = path; npc.pi = 0;
    }

    function defect(wid, trySteal, fromPos) {
      const w = worker(S, wid);
      if (!w) return null;
      sess.team = sess.team.filter(x => x !== wid);
      S.workers = S.workers.filter(x => x.id !== wid);
      const ni = sess.npcs.findIndex(n => n.wid === wid);
      let npc;
      if (ni >= 0) { npc = sess.npcs[ni]; release(npc); }
      else { npc = mkNpc(wid, fromPos.x, fromPos.y); sess.npcs.push(npc); }
      npc.state = 'flee'; npc.wname = w.name; npc.stolen = null; npc.fleeT = 0;
      if (trySteal && sess.stones.length && Math.random() < 0.5) {
        npc.stolen = sess.stones.splice(Math.floor(Math.random() * sess.stones.length), 1)[0];
      }
      findPathTo(npc, Math.floor(sess.lv.spawn.x), Math.floor(sess.lv.spawn.y));
      return npc;
    }

    function escapeNow(npc) {
      sess.npcs = sess.npcs.filter(n => n !== npc);
      const m = '🏃 ' + npc.wname + ' 消失在洞口外' + (npc.stolen ? '，帶走了那顆 ' + npc.stolen.kg + 'kg 的料' : '') + '。';
      say(m); sess.log.push(m); global.GAME.log(m, 'bad');
    }

    function fleeStep(npc, dt) {
      npc.fleeT += dt;
      const tgt = npc.path && npc.path[npc.pi];
      if (!tgt || npc.fleeT > 25) { escapeNow(npc); return; }
      const txc = tgt.x + 0.5, tyc = tgt.y + 0.5;
      const dx = txc - npc.x, dy = tyc - npc.y, dlen = Math.hypot(dx, dy);
      if (dlen < 0.15) { npc.pi++; if (npc.pi >= npc.path.length) escapeNow(npc); return; }
      const sp = 3.4;
      npc.x += dx / dlen * sp * dt; npc.y += dy / dlen * sp * dt;
      npc.ang = Math.atan2(dy, dx); npc.phase += sp * dt * 3.5;
    }

    /* ---- 準星鎖定：逃跑者好瞄，自己人要瞄得很準才算數 ---- */
    function npcInSight() {
      const p = sess.player, lv = sess.lv;
      let best = null, bd = 99;
      for (const n of sess.npcs) {
        const flee = n.state === 'flee';
        const maxD = flee ? 14 : 8, cone = flee ? 0.16 : 0.09;
        const dx = n.x - p.x, dy = n.y - p.y;
        const d = Math.hypot(dx, dy);
        if (d > maxD || d < 0.3) continue;
        let da = Math.atan2(dy, dx) - p.ang;
        while (da > Math.PI) da -= 2 * Math.PI;
        while (da < -Math.PI) da += 2 * Math.PI;
        if (Math.abs(da) > cone) continue;
        let blocked = false;
        for (let t = 0.3; t < d; t += 0.25) {
          const cx = Math.floor(p.x + dx / d * t), cy = Math.floor(p.y + dy / d * t);
          if (lv.map[idx(cx, cy)] !== OPEN) { blocked = true; break; }
        }
        if (blocked) continue;
        // 逃跑者優先鎖定
        const score = (flee ? 0 : 50) + d;
        if (score < bd) { bd = score; best = n; }
      }
      return best;
    }
    function thiefInSight() { const n = npcInSight(); return n && n.state === 'flee' ? n : null; }

    /* ---- 擊斃：命案的代價全部到帳 ---- */
    function shootThief(npc) {
      S.equip.shotgun.dur = Math.max(0, S.equip.shotgun.dur - 3);
      flash = 0.5;
      sess.npcs = sess.npcs.filter(n => n !== npc);
      if (npc.stolen) sess.stones.push(npc.stolen);
      S.heat = (S.heat || 0) + 1;
      S.stats.deaths = (S.stats.deaths || 0) + 1;
      S.rep = Math.max(0, S.rep - 20);
      S.morale = Math.max(0, S.morale - 25);
      const lines = ['🔫 你朝逃跑的 ' + npc.wname + ' 開了槍。他倒在坑道裡，再也沒有起來。'];
      if (npc.stolen) lines.push('料拿回來了 — 上面沾著血。');
      sess.team.slice().forEach(id => {
        const w = worker(S, id);
        if (!w || id === sess.active) return;
        w.morale = Math.max(0, w.morale - 40);
        if (w.morale < 15 && Math.random() < 0.6) {
          const d2 = defect(id, false, { x: npc.x, y: npc.y });
          if (d2) lines.push('😱 ' + d2.wname + ' 嚇瘋了，頭也不回往洞口逃。');
        }
      });
      lines.forEach((l, i) => { sess.log.push(l); global.GAME.log(l, 'bad'); if (i === 0) say(l); });
      setTimeout(() => { if (running) say('這件事不會就這樣過去的。'); }, 2400);
      for (let i = 0; i < 40; i++) particles.push({
        x: cv.width / 2, y: cv.height / 2,
        vx: (Math.random() - 0.5) * 500, vy: (Math.random() - 0.7) * 400,
        life: 0.5 + Math.random() * 0.5, max: 1, size: 1 + Math.random() * 3, c: [180, 40, 40]
      });
      hud();
    }

    /* ---- 射殺自己人：謀殺，或處理掉失控的實驗品 ---- */
    function shootWorker(npc) {
      const w = worker(S, npc.wid);
      if (!w) return;
      S.equip.shotgun.dur = Math.max(0, S.equip.shotgun.dur - 3);
      flash = 0.5;
      sess.npcs = sess.npcs.filter(n => n !== npc);
      sess.team = sess.team.filter(x => x !== npc.wid);
      S.workers = S.workers.filter(x => x.id !== npc.wid);
      S.stats.deaths = (S.stats.deaths || 0) + 1;
      const lines = [];
      if (w.mutant) {
        S.morale = Math.max(0, S.morale - 5);
        lines.push('🔫 你放倒了 ' + w.name + '。實驗品不會留下屍體以外的麻煩。');
      } else {
        S.heat = (S.heat || 0) + 2;
        S.rep = Math.max(0, S.rep - 30);
        S.morale = Math.max(0, S.morale - 35);
        lines.push('🔫 你朝自己的工人 ' + w.name + ' 開了槍。坑道裡死一般的安靜。');
        sess.team.slice().forEach(id => {
          const o = worker(S, id);
          if (!o || id === sess.active || o.mutant) return;
          o.morale = Math.max(0, o.morale - 50);
          if (Math.random() < 0.8) {
            const d2 = defect(id, false, { x: npc.x, y: npc.y });
            if (d2) lines.push('😱 ' + d2.wname + ' 尖叫著逃出坑道。');
          }
        });
      }
      lines.forEach((l, i) => { sess.log.push(l); global.GAME.log(l, 'bad'); if (i === 0) say(l); });
      for (let i = 0; i < 40; i++) particles.push({
        x: cv.width / 2, y: cv.height / 2,
        vx: (Math.random() - 0.5) * 500, vy: (Math.random() - 0.7) * 400,
        life: 0.5 + Math.random() * 0.5, max: 1, size: 1 + Math.random() * 3, c: [180, 40, 40]
      });
      hud();
    }

    /* ---- 開槍：準星裡有人就是擊斃，否則對天威嚇 ---- */
    function menace() {
      if (night) return;
      if (!hasWorking(S, 'shotgun')) { say('你沒有槍。'); return; }
      const tgt2 = npcInSight();
      if (tgt2) { if (tgt2.state === 'flee') shootThief(tgt2); else shootWorker(tgt2); return; }
      S.equip.shotgun.dur = Math.max(0, S.equip.shotgun.dur - 2);
      flash = 0.35;
      sess.fearT = 45;
      S.rep = Math.max(0, S.rep - 3);
      S.morale = Math.max(0, S.morale - 6);
      const lines = [];
      sess.team.slice().forEach(id => {
        const w = worker(S, id);
        if (!w || id === sess.active || w.mutant) return;
        w.morale = Math.max(0, w.morale - 15);
        if (w.morale < 25 && Math.random() < 0.5) {
          const npc = defect(id, true, sess.player);
          if (npc) lines.push('💢 ' + npc.wname + ' 把鎬一摔：「開槍啊！」' +
            (npc.stolen ? '抓起一顆 ' + npc.stolen.kg + 'kg 的料' : '') + '往洞口跑了！');
        }
      });
      say('🔫 砰！槍聲在坑道裡炸開 — 沒人敢停手了（士氣 -15、名聲 -3）');
      lines.forEach(l => { sess.log.push(l); global.GAME.log(l, 'bad'); });
      if (lines.length) setTimeout(() => { if (running) say(lines[0]); }, 1800);
      hud();
    }

    /* ---- 坑道過夜 ---- */
    function doSleep() {
      if (night) return;
      const r = global.GAME.sleepInMine();
      if (!r.ok) { say(r.msg); return; }
      night = {
        t: 0,
        lines: ['第 ' + S.day + ' 天　' + S.weather.icon + ' ' + S.weather.name]
          .concat((r.notes || []).slice(0, 5))
      };
      hud();
    }

    /* ---- 揮動：關節動畫 ---- */
    function doDig() {
      if (night) return;
      if (swing.t < 1) return;                 // 上一下還沒揮完
      const eq = EQUIP[sess.tool];
      const c = canUse(S, sess, sess.tool);
      if (!c.ok) { say(c.why); return; }
      swing.t = 0; swing.hit = false;
      swing.dur = eq.tool.pattern === 'blast' ? 1.1 : eq.tool.stam > 8 ? 0.6 : 0.42;
    }

    function applyHit() {
      const r = dig(S, sess);
      if (!r.ok) { say(r.msg); return; }
      if (r.msg) say(r.msg);
      // 碎屑粒子
      const t = r.target;
      const cell = t ? TYPE[t.t] || TYPE[1] : TYPE[1];
      const n = EQUIP[sess.tool].tool.pattern === 'blast' ? 90 : 26;
      for (let i = 0; i < n; i++) {
        particles.push({
          x: cv.width / 2 + (Math.random() - 0.5) * 90,
          y: cv.height / 2 + (Math.random() - 0.5) * 90,
          vx: (Math.random() - 0.5) * 620, vy: (Math.random() - 0.9) * 520,
          life: 0.5 + Math.random() * 0.6, max: 1.1,
          size: 1 + Math.random() * 3.5,
          c: cell.rgb
        });
      }
      (r.got || []).forEach(() => {
        for (let i = 0; i < 60; i++) particles.push({
          x: cv.width / 2, y: cv.height / 2,
          vx: (Math.random() - 0.5) * 700, vy: (Math.random() - 0.5) * 700,
          life: 0.9 + Math.random() * 0.7, max: 1.6, size: 1.5 + Math.random() * 3,
          c: [80, 240, 190], glow: true
        });
      });
      hud();
    }

    /* ---- 移動 ---- */
    function move(dt) {
      if (night) return;
      const p = sess.player, lv = sess.lv;
      const w = worker(S, sess.active);
      let sp = 2.7 * (keys.ShiftLeft ? 1.6 : 1);
      if (w && w.stam < 20) sp *= 0.6;
      const here = idx(Math.floor(p.x), Math.floor(p.y));
      if (lv.wet[here] && !sess.pumpOn) sp *= 0.45;             // 積水難走

      let fx = 0, fy = 0;
      if (keys.KeyW || keys.ArrowUp) fx += 1;
      if (keys.KeyS || keys.ArrowDown) fx -= 1;
      if (keys.KeyA) fy -= 1;
      if (keys.KeyD) fy += 1;
      fx += joy.f; fy += joy.s;
      if (keys.ArrowLeft) p.ang -= 1.8 * dt;
      if (keys.ArrowRight) p.ang += 1.8 * dt;
      if (Math.abs(fx) < 0.08 && Math.abs(fy) < 0.08) { p.bob *= 0.9; return; }

      const c = Math.cos(p.ang), s = Math.sin(p.ang);
      let dx = (c * fx - s * fy), dy = (s * fx + c * fy);
      const len = Math.hypot(dx, dy) || 1;
      dx = dx / len * sp * dt; dy = dy / len * sp * dt;
      const R = 0.28;
      const solid = (x, y) => {
        const t = lv.map[idx(Math.floor(x), Math.floor(y))];
        return t !== OPEN && t !== undefined;
      };
      if (!solid(p.x + dx + Math.sign(dx) * R, p.y)) p.x += dx;
      if (!solid(p.x, p.y + dy + Math.sign(dy) * R)) p.y += dy;
      p.bob += sp * dt * 3.4;
      markSeen(sess);
    }

    /* ---- 光線投射渲染 ---- */
    function render() {
      const p = sess.player, lv = sess.lv;
      const lightR = lightRadius(S, sess);
      const fov = 0.9;
      const dirX = Math.cos(p.ang), dirY = Math.sin(p.ang);
      const planeX = -dirY * fov, planeY = dirX * fov;
      const horizon = (RH >> 1) + Math.sin(p.bob) * 2.2;

      // 天花板與地板（含地上的導引線）
      for (let y = 0; y < RH; y++) {
        const isFloor = y > horizon;
        const rowDist = isFloor ? (0.5 * RH) / (y - horizon) : (0.5 * RH) / (horizon - y);
        const stepX = (dirX + planeX) * rowDist, stepY = (dirY + planeY) * rowDist;
        const dX = ((dirX - planeX) * rowDist - stepX) / RW, dY = ((dirY - planeY) * rowDist - stepY) / RW;
        let fxp = p.x + stepX, fyp = p.y + stepY;
        const fog = Math.max(0, 1 - rowDist / lightR);
        const shade = fog * fog;
        for (let x = 0; x < RW; x++) {
          const cxi = Math.floor(fxp), cyi = Math.floor(fyp);
          let r, g, b;
          if (isFloor) {
            const k = idx(cxi, cyi);
            const onPath = cxi > 0 && cyi > 0 && cxi < MS && cyi < MS && lv.path[k];
            const wetc = cxi > 0 && cyi > 0 && cxi < MS && cyi < MS && lv.wet[k] && !sess.pumpOn;
            const chk = ((cxi * 7 + cyi * 13) & 3) * 6;
            if (onPath) {
              // 螢光導引線：自體發光，黑暗中也看得見
              const pulse = 0.75 + 0.25 * Math.sin(perf * 3 + cxi + cyi);
              const em = Math.max(shade, 0.42 * pulse);
              r = 30 * em; g = (150 + 90 * pulse) * em; b = (120 + 60 * pulse) * em;
            } else if (wetc) { r = 20 * shade; g = (60 + chk) * shade; b = (95 + chk) * shade; }
            else { r = (62 + chk) * shade; g = (52 + chk) * shade; b = (40 + chk) * shade; }
          } else {
            const chk = ((cxi * 5 + cyi * 11) & 3) * 4;
            r = (30 + chk) * shade; g = (28 + chk) * shade; b = (26 + chk) * shade;
          }
          const o = (y * RW + x) << 2;
          px[o] = r; px[o + 1] = g; px[o + 2] = b; px[o + 3] = 255;
          fxp += dX; fyp += dY;
        }
      }

      // 牆面
      for (let x = 0; x < RW; x++) {
        const camX = 2 * x / RW - 1;
        const rdx = dirX + planeX * camX, rdy = dirY + planeY * camX;
        let mapX = Math.floor(p.x), mapY = Math.floor(p.y);
        const dDistX = Math.abs(1 / (rdx || 1e-6)), dDistY = Math.abs(1 / (rdy || 1e-6));
        let stepX2, stepY2, sideDistX, sideDistY;
        if (rdx < 0) { stepX2 = -1; sideDistX = (p.x - mapX) * dDistX; } else { stepX2 = 1; sideDistX = (mapX + 1 - p.x) * dDistX; }
        if (rdy < 0) { stepY2 = -1; sideDistY = (p.y - mapY) * dDistY; } else { stepY2 = 1; sideDistY = (mapY + 1 - p.y) * dDistY; }
        let hit = 0, side = 0, guard = 0;
        while (!hit && guard++ < 90) {
          if (sideDistX < sideDistY) { sideDistX += dDistX; mapX += stepX2; side = 0; }
          else { sideDistY += dDistY; mapY += stepY2; side = 1; }
          if (mapX < 0 || mapY < 0 || mapX >= MS || mapY >= MS) break;
          if (lv.map[idx(mapX, mapY)] !== OPEN) hit = 1;
        }
        if (!hit) { zbuf[x] = 1e9; continue; }
        const dist = side === 0 ? (sideDistX - dDistX) : (sideDistY - dDistY);
        zbuf[x] = dist;
        const h = Math.floor(RH / Math.max(dist, 0.12));
        let y0 = Math.floor(horizon - h / 2), y1 = Math.floor(horizon + h / 2);
        const cell = lv.map[idx(mapX, mapY)];
        const T = TYPE[cell] || TYPE[1];
        const k = idx(mapX, mapY);
        const dmg = 1 - Math.max(0, lv.hp[k]) / (T.hp * 2.2);      // 打過的痕跡
        const fog = Math.max(0, 1 - dist / lightR);
        let shade = fog * fog * (side ? 0.72 : 1);
        // 玉肉透光：快挖穿又有料時透出綠光
        const node = lv.nodes[k];
        const glow = node && lv.hp[k] < T.hp * 0.55 ? (1 - lv.hp[k] / (T.hp * 0.55)) : 0;
        let r = T.rgb[0], g = T.rgb[1], b = T.rgb[2];
        if (dmg > 0) { r += dmg * 55; g += dmg * 40; b += dmg * 20; }
        if (glow > 0) { r = r * (1 - glow) + 70 * glow; g = g * (1 - glow) + 255 * glow; b = b * (1 - glow) + 190 * glow; }
        if (lv.wet[k] && !sess.pumpOn) { r *= 0.7; g *= 0.9; b *= 1.25; }
        r *= shade; g *= shade; b *= shade;
        if (y0 < 0) y0 = 0; if (y1 > RH) y1 = RH;
        for (let y = y0; y < y1; y++) {
          const o = (y * RW + x) << 2;
          px[o] = r; px[o + 1] = g; px[o + 2] = b; px[o + 3] = 255;
        }
      }

      offCtx.putImageData(buf, 0, 0);

      // ---- 隊友（billboard，吃 zbuffer 遮擋與照明衰減） ----
      const labels = [];
      const order = sess.npcs
        .map(n => ({ n, d: (n.x - p.x) * (n.x - p.x) + (n.y - p.y) * (n.y - p.y) }))
        .sort((a, b) => b.d - a.d);
      const invDet = 1 / (planeX * dirY - dirX * planeY);
      for (const { n } of order) {
        const w = worker(S, n.wid);
        if (!w && n.state !== 'flee') continue;
        const dx = n.x - p.x, dy = n.y - p.y;
        const tX = invDet * (dirY * dx - dirX * dy);
        const tY = invDet * (-planeY * dx + planeX * dy);
        if (tY < 0.22) continue;
        const sx = Math.floor((RW / 2) * (1 + tX / tY));
        if (sx < -40 || sx > RW + 40) continue;
        const col = Math.max(0, Math.min(RW - 1, sx));
        if (tY >= zbuf[col] + 0.15) continue;                 // 被牆擋住
        const a = Math.max(0, Math.min(1, 1 - tY / lightR));
        if (a <= 0.04) continue;                              // 黑暗中看不見
        const h = Math.min(RH / tY, RH * 1.15);
        drawMiner(offCtx, sx, horizon, h * (w && w.mutant ? 1.28 : 1), n, a, w && w.mutant);
        labels.push({ sx, top: horizon - h * 0.42, name: w ? w.name : (n.wname || '?'), a, state: n.state, tY, mut: !!(w && w.mutant) });
      }

      ctx.drawImage(off, 0, 0, RW, RH, 0, 0, cv.width, cv.height);

      // 名牌（放大後畫，才不會糊）
      const kx = cv.width / RW, ky = cv.height / RH;
      for (const L of labels) {
        if (L.tY > 7) continue;
        ctx.globalAlpha = L.a;
        ctx.font = '600 13px "Noto Sans TC",sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#0009';
        const icon = L.state === 'flee' ? '🏃💎' : L.mut ? '🧟' : sess.fearT > 0 ? '😨' : L.state === 'dig' ? '⛏' : L.state === 'walk' ? '👣' : L.state === 'rest' ? '😮‍💨' : '·';
        const txt = icon + ' ' + L.name;
        const tx2 = L.sx * kx, ty2 = L.top * ky;
        ctx.fillRect(tx2 - ctx.measureText(txt).width / 2 - 5, ty2 - 13, ctx.measureText(txt).width + 10, 17);
        ctx.fillStyle = '#d9f5e8';
        ctx.fillText(txt, tx2, ty2);
        ctx.globalAlpha = 1;
      }
      ctx.textAlign = 'left';
    }

    // 迷你礦工人形：頭盔、身體、走路擺腿、挖掘揮臂
    function drawMiner(c2, sx, horizon, h, n, a, mut) {
      const fy = horizon + h * 0.5;             // 腳踩地
      const hb = h * 0.58, wb = hb * 0.3;
      c2.save();
      c2.globalAlpha = a;
      c2.lineCap = 'round';
      const walk = n.state === 'walk' ? Math.sin(n.phase) : 0;
      // 腿
      c2.strokeStyle = '#2b3138'; c2.lineWidth = Math.max(1.5, wb * 0.3);
      c2.beginPath();
      c2.moveTo(sx, fy - hb * 0.45); c2.lineTo(sx - walk * wb * 0.5, fy);
      c2.moveTo(sx, fy - hb * 0.45); c2.lineTo(sx + walk * wb * 0.5, fy);
      c2.stroke();
      // 身體（工作背心）
      c2.fillStyle = mut ? '#4a6b32' : n.state === 'rest' ? '#4a4438' : '#33584a';
      c2.fillRect(sx - wb / 2, fy - hb * 0.95, wb, hb * 0.52);
      // 頭 + 安全帽
      c2.fillStyle = mut ? '#7da05e' : '#a5745a';
      c2.beginPath(); c2.arc(sx, fy - hb * 1.04, hb * 0.12, 0, 7); c2.fill();
      c2.fillStyle = '#e8c46a';
      c2.beginPath(); c2.arc(sx, fy - hb * 1.07, hb * 0.13, Math.PI, 0); c2.fill();
      // 手臂（挖掘時掄鎬）
      const dig = n.state === 'dig';
      const armA = dig ? -0.7 + Math.abs(Math.sin(n.phase * 1.6)) * 1.5 : 0.5 + walk * 0.3;
      const shX = sx + wb * 0.45, shY = fy - hb * 0.88;
      const haX = shX + Math.cos(armA) * hb * 0.3, haY = shY + Math.sin(armA) * hb * 0.3;
      c2.strokeStyle = '#8a6547'; c2.lineWidth = Math.max(1.5, wb * 0.24);
      c2.beginPath(); c2.moveTo(shX, shY); c2.lineTo(haX, haY); c2.stroke();
      if (dig) {   // 鎬子
        c2.strokeStyle = '#c9d2da'; c2.lineWidth = Math.max(1, wb * 0.14);
        c2.beginPath(); c2.moveTo(haX, haY);
        c2.lineTo(haX + Math.cos(armA - 0.5) * hb * 0.34, haY + Math.sin(armA - 0.5) * hb * 0.34);
        c2.stroke();
      }
      c2.restore();
    }

    /* ---- 手臂關節動畫 ---- */
    function drawArm() {
      const W = cv.width, H = cv.height;
      const eq = EQUIP[sess.tool];
      if (!eq) return;
      const p = sess.player;
      const t = Math.min(1, swing.t);
      // 揮動曲線：抬起 → 下砸 → 收回
      const raise = t < 0.35 ? t / 0.35 : t < 0.55 ? 1 - (t - 0.35) / 0.2 * 1.35 : -0.35 + (t - 0.55) / 0.45 * 0.35;
      const bob = Math.sin(p.bob) * 0.02, bob2 = Math.cos(p.bob * 2) * 0.012;

      const pat = eq.tool.pattern;
      const heavy = pat === 'box3' || pat === 'blast' || eq.tool.power > 40;
      const S0 = { x: W * (0.80 + bob2), y: H * (1.16 + bob) };          // 肩
      const upper = H * 0.34, fore = H * 0.30;

      // 肩→肘→腕 的關節角度
      let a1 = -1.15 - raise * 0.95;             // 上臂
      let a2 = 0.85 + raise * 1.25;              // 前臂相對角
      if (pat === 'cross') { a1 += Math.sin(swing.t * 40) * 0.04; a2 += Math.cos(swing.t * 40) * 0.05; } // 風鎬震動
      if (heavy) { a1 -= 0.12; }

      const E = { x: S0.x + Math.cos(a1) * upper, y: S0.y + Math.sin(a1) * upper };
      const Hd = { x: E.x + Math.cos(a1 + a2) * fore, y: E.y + Math.sin(a1 + a2) * fore };

      ctx.save();
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      // 上臂（袖子）
      ctx.strokeStyle = '#2c3b33'; ctx.lineWidth = H * 0.085;
      ctx.beginPath(); ctx.moveTo(S0.x, S0.y); ctx.lineTo(E.x, E.y); ctx.stroke();
      // 前臂（皮膚）
      ctx.strokeStyle = '#8a6547'; ctx.lineWidth = H * 0.068;
      ctx.beginPath(); ctx.moveTo(E.x, E.y); ctx.lineTo(Hd.x, Hd.y); ctx.stroke();
      // 手套
      ctx.fillStyle = '#3a2f26';
      ctx.beginPath(); ctx.arc(Hd.x, Hd.y, H * 0.042, 0, 7); ctx.fill();

      // 工具本體：從手往前延伸
      const ta = a1 + a2 - 0.5;
      const tl = H * (heavy ? 0.34 : 0.26);
      const Tp = { x: Hd.x + Math.cos(ta) * tl, y: Hd.y + Math.sin(ta) * tl };
      ctx.strokeStyle = '#6b4d2f'; ctx.lineWidth = H * 0.022;
      ctx.beginPath(); ctx.moveTo(Hd.x, Hd.y); ctx.lineTo(Tp.x, Tp.y); ctx.stroke();

      ctx.translate(Tp.x, Tp.y); ctx.rotate(ta);
      ctx.fillStyle = '#c9d2da';
      const s = H * 0.001;
      switch (sess.tool) {
        case 'pickaxe':
          ctx.fillRect(-60 * s, -6 * s, 120 * s, 12 * s);
          ctx.beginPath(); ctx.moveTo(60 * s, 0); ctx.lineTo(30 * s, -22 * s); ctx.lineTo(34 * s, 6 * s); ctx.fill(); break;
        case 'sledge': ctx.fillRect(-26 * s, -34 * s, 52 * s, 68 * s); break;
        case 'chisel':
          ctx.fillStyle = '#b9c2cc'; ctx.fillRect(-8 * s, -8 * s, 70 * s, 16 * s);
          ctx.beginPath(); ctx.moveTo(62 * s, -8 * s); ctx.lineTo(78 * s, 0); ctx.lineTo(62 * s, 8 * s); ctx.fill(); break;
        case 'shovel':
          ctx.beginPath(); ctx.ellipse(30 * s, 0, 38 * s, 26 * s, 0, 0, 7); ctx.fill(); break;
        case 'prybar':
          ctx.fillRect(-70 * s, -5 * s, 140 * s, 10 * s);
          ctx.beginPath(); ctx.moveTo(70 * s, -5 * s); ctx.lineTo(92 * s, -16 * s); ctx.lineTo(92 * s, 4 * s); ctx.fill(); break;
        case 'jackhammer':
          ctx.fillStyle = '#d8a13a'; ctx.fillRect(-40 * s, -22 * s, 80 * s, 44 * s);
          ctx.fillStyle = '#9aa3ad'; ctx.fillRect(40 * s, -7 * s, 90 * s, 14 * s); break;
        case 'excavator':
          ctx.fillStyle = '#e0a92b'; ctx.fillRect(-90 * s, -18 * s, 180 * s, 30 * s);
          ctx.fillStyle = '#8c939b';
          ctx.beginPath(); ctx.moveTo(90 * s, -18 * s); ctx.lineTo(150 * s, 10 * s); ctx.lineTo(90 * s, 40 * s); ctx.fill(); break;
        case 'dynamite_kit':
          ctx.fillStyle = '#c0392b'; ctx.fillRect(-14 * s, -34 * s, 28 * s, 68 * s);
          ctx.strokeStyle = '#e8c46a'; ctx.lineWidth = 3 * s;
          ctx.beginPath(); ctx.moveTo(0, -34 * s); ctx.quadraticCurveTo(30 * s, -60 * s, 60 * s, -40 * s); ctx.stroke(); break;
        default: ctx.fillRect(-30 * s, -8 * s, 60 * s, 16 * s);
      }
      ctx.restore();
    }

    /* ---- 粒子 ---- */
    function drawParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const q = particles[i];
        q.life -= dt;
        if (q.life <= 0) { particles.splice(i, 1); continue; }
        q.vy += 1400 * dt;
        q.x += q.vx * dt; q.y += q.vy * dt;
        const a = Math.max(0, q.life / q.max);
        ctx.fillStyle = 'rgba(' + (q.c[0] | 0) + ',' + (q.c[1] | 0) + ',' + (q.c[2] | 0) + ',' + a + ')';
        if (q.glow) { ctx.shadowColor = 'rgba(80,255,200,.9)'; ctx.shadowBlur = 12; }
        ctx.fillRect(q.x, q.y, q.size, q.size);
        ctx.shadowBlur = 0;
      }
    }

    /* ---- 小地圖（只畫走過的地方） ---- */
    function drawMap() {
      const lv = sess.lv, p = sess.player;
      const R = 14, cell = 150 / (R * 2);
      mapCtx.clearRect(0, 0, 150, 150);
      mapCtx.fillStyle = 'rgba(4,8,10,.85)'; mapCtx.fillRect(0, 0, 150, 150);
      for (let j = -R; j < R; j++) for (let i = -R; i < R; i++) {
        const x = Math.floor(p.x) + i, y = Math.floor(p.y) + j;
        if (x < 0 || y < 0 || x >= MS || y >= MS) continue;
        const k = idx(x, y);
        if (!lv.seen[k]) continue;
        const t = lv.map[k];
        mapCtx.fillStyle = t === OPEN ? (lv.path[k] ? '#2f8f6d' : '#20272e') : (t === VEIN ? '#2b4a3f' : '#3a4048');
        mapCtx.fillRect((i + R) * cell, (j + R) * cell, cell, cell);
      }
      mapCtx.fillStyle = '#5db2ff';
      for (const n of sess.npcs) {
        const mx = 75 + (n.x - p.x) * cell, my = 75 + (n.y - p.y) * cell;
        if (mx > 2 && my > 2 && mx < 148 && my < 148) { mapCtx.beginPath(); mapCtx.arc(mx, my, 2.2, 0, 7); mapCtx.fill(); }
      }
      mapCtx.fillStyle = '#ffd76a';
      mapCtx.beginPath(); mapCtx.arc(75, 75, 3, 0, 7); mapCtx.fill();
      mapCtx.strokeStyle = '#ffd76a'; mapCtx.beginPath(); mapCtx.moveTo(75, 75);

(function (global) {

        P.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, life: 0.4 + Math.random() * 0.9, max: 1.3, s: 1 + Math.random() * 3, c: col });

      S.supply.diesel -= loss;
      return '油桶在爛路上顛破，漏掉 ' + loss + ' 公升柴油。';
    } else if (r < 0.8 && w) {
      w.injury += 1; w.stam = Math.floor(w.stam * 0.5);
      return '⚠️ ' + w.name + ' 在陡坡滑了一跤，扭傷，休息一天。';
    }
    S.money -= 3000;
    return '半路遇到臨檢站，塞了 ' + money(3000) + ' 才放行。';
  }

  /* ---------------- 收工下山 ---------------- */
  function haulOptions() {
    if (!S.session) return [];
    const stash = S.stash[S.session.siteId] || [];
    return S.session.stones.concat(stash);
  }

  function endMining(selectedIds) {
    if (!S.session) return { ok: false };
    const site = S.session.site;
    const all = haulOptions();
    const cap = carryCapacity(site);
    const chosen = all.filter(s => selectedIds.indexOf(s.id) >= 0);
    const load = chosen.reduce((a, s) => a + s.kg, 0);
    if (load > cap) return { ok: false, msg: '超載了：' + load.toFixed(1) + 'kg / 上限 ' + cap + 'kg' };

    chosen.forEach(s => S.stones.push(s));
    const left = all.filter(s => selectedIds.indexOf(s.id) < 0);
    S.stash[site.id] = left;
    S.stats.mined += S.session.stones.length;
    if (S.session.collapsed) S.stats.accidents += S.session.collapsed;

    log('收工下山：帶回 ' + chosen.length + ' 顆共 ' + load.toFixed(1) + 'kg' +
      (left.length ? '，' + left.length + ' 顆留在 ' + site.name + ' 山上' : '') + '。', 'ok');
    S.session = null;
    return { ok: true, hauled: chosen.length, left: left.length };
  }

  /* ---------------- 結束一天 ---------------- */
  function endDay(inMine) {
    if (S.session && !inMine) return { ok: false, msg: '隊伍還在山上，先收工。' };
    const notes = [];

    // 工資
    let wages = 0;
    S.workers.forEach(w => { if (w.mutant) return; wages += w.injury > 0 ? Math.round(w.wage * 0.5) : w.wage; });
    S.money -= wages;
    notes.push('發工資 ' + money(wages));
    if (S.money < 0) {
      S.morale -= 10;
      S.workers.forEach(w => w.morale -= 8);
      notes.push('資金見底，工人開始議論欠薪。');
    }

    // 糧食
    let need = S.workers.length + S.workers.filter(w => w.mutant).length * 4;
    if (has('stove')) need = Math.ceil(need * 0.8);
    for (const id in S.equip) {
      const def = EQUIP[id];
      if (def.upkeep && def.upkeep.food && S.equip[id].qty > 0) need += def.upkeep.food * S.equip[id].qty;
    }
    if (S.supply.food >= need) {
      S.supply.food -= need;
      if (has('stove')) { S.morale += 3; S.workers.forEach(w => w.morale = Math.min(100, w.morale + 3)); }
    } else {
      S.supply.food = 0;
      S.morale -= 12;
      S.workers.forEach(w => w.morale = Math.max(0, w.morale - 10));
      notes.push('⚠️ 糧食不足，全隊餓肚子，士氣重挫。');
    }

    // 休息回復（坑道裡打地鋪恢復差很多）
    const restBonus = has('tent') ? (inMine ? 5 : 10) : 0;
    const restRate = inMine ? 0.38 : 0.55;
    S.workers.forEach(w => {
      w.stam = Math.min(w.maxStam, w.stam + Math.round(w.maxStam * restRate) + restBonus);
      if (w.injury > 0) {
        w.injury--;
        if (S.supply.medicine > 0 && Math.random() < 0.6) { S.supply.medicine--; w.injury = Math.max(0, w.injury - 1); }
        if (w.injury === 0) notes.push(w.name + ' 傷好了，明天可以下坑。');
      }
      w.morale = Math.min(100, Math.max(0, w.morale + (S.money > 0 ? 2 : -2)));
    });
    S.morale = Math.min(100, Math.max(0, S.morale + (S.money > 0 ? 1 : -3)));

    // 離職
    S.workers.slice().forEach(w => {
      if (w.morale < 18 && Math.random() < 0.35) {
        S.workers = S.workers.filter(x => x.id !== w.id);
        notes.push('💔 ' + w.name + ' 收拾行李走人了。');
      }
    });

    // 市場波動
    const drift = (Math.random() - 0.48) * 0.09;
    S.market = J.clamp(S.market * (1 + drift), 0.55, 2.2);
    if (Math.random() < 0.12) {
      const shock = Math.random() < 0.5 ? -0.18 : 0.22;
      S.market = J.clamp(S.market * (1 + shock), 0.5, 2.6);
      notes.push(shock > 0 ? '📈 邊境開盤消息熱，玉價指數跳漲。' : '📉 買家縮手，玉價指數走跌。');
    }
    if (S.day % 2 === 0) rollBuyers();

    // 命案後果：民兵動身了，天亮就到（到營地畫面會攔住你做選擇）
    if (S.heat) {
      S.pendingMilitia = (S.pendingMilitia || 0) + S.heat;
      S.heat = 0;
      notes.push('⚠️ 坑裡開槍打死人的事傳到山下 — 有一隊人正往你的營地來。');
    }

    // 變異工人：不用薪水、絕對服從，但身體在倒數
    S.workers.slice().forEach(w => {
      if (!w.mutant) return;
      w.morale = 100;
      w.stam = w.maxStam;
      if (--w.mutDays <= 0) {
        S.workers = S.workers.filter(x => x.id !== w.id);
        S.stats.deaths = (S.stats.deaths || 0) + 1;
        notes.push('🧟 ' + w.name + ' 的心臟撐不住變異，天沒亮就倒在工寮外。');
        S.workers.forEach(o => { if (!o.mutant) o.morale = Math.max(0, o.morale - 10); });
      }
    });

    // 天氣
    S.weather = rollWeather();

    S.day++;
    S.stats.days++;
    log('—— 第 ' + S.day + ' 天　' + S.weather.icon + S.weather.name + '　' + S.weather.desc, 'day');
    notes.forEach(n => log(n));

    if (S.money < -120000) {
      S.over = '破產：債主上門，礦權被收回，隊伍就地解散。';
      log('💀 ' + S.over, 'bad');
    }
    save();
    return { ok: true, notes };
  }

  function rollWeather() {
    const r = Math.random();
    // 雨季（每 30 天為一輪，第 12~24 天雨多）
    const wet = (S.day % 30) >= 12 && (S.day % 30) <= 24;
    if (wet) {
      if (r < 0.32) return WEATHER[2];
      if (r < 0.5) return WEATHER[3];
      if (r < 0.66) return WEATHER[4];
      if (r < 0.85) return WEATHER[1];
      return WEATHER[0];
    }
    if (r < 0.45) return WEATHER[0];
    if (r < 0.7) return WEATHER[1];
    if (r < 0.85) return WEATHER[2];
    if (r < 0.93) return WEATHER[4];
    return WEATHER[3];
  }

  /* ---------------- 坑道過夜 ---------------- */
  function sleepInMine() {
    if (!S.session) return { ok: false, msg: '不在坑裡' };
    const sess = S.session, site = sess.site;
    const owned = !!(S.owned && S.owned[site.id]);
    if (!owned && S.money < site.fee) {
      return { ok: false, msg: '付不出明天的礦權日費 ' + money(site.fee) + '，只能下山了' };
    }
    const r = endDay(true);
    if (!r.ok) return r;
    const notes = r.notes.slice();
    const extra = [];

    if (!owned) { S.money -= site.fee; extra.push('隔天礦權日費 ' + money(site.fee)); }
    if (!has('tent')) {
      S.workers.forEach(w => { if (sess.team.indexOf(w.id) >= 0) w.morale = Math.max(0, w.morale - 6); });
      extra.push('沒有帳篷，全隊在坑道裡打地鋪，腰酸背痛（士氣 -6）。');
    }

    // 夜裡塌方：危險場口、壞天氣、坑木不足時最可怕
    const risk = Math.min(0.35, M.collapseRisk(S, sess) * 0.55 * S.weather.danger);
    if (Math.random() < risk) {
      const crew = sess.team.map(id => S.workers.find(w => w.id === id)).filter(Boolean);
      const w = crew[Math.floor(Math.random() * crew.length)];
      if (w) {
        const days = 1 + Math.floor(Math.random() * 3);
        w.injury += days;
        w.morale = Math.max(0, w.morale - 10);
        S.stats.accidents++;
        extra.push('⚠️ 睡到半夜塌了一角，' + w.name + ' 被砸傷，休養 ' + days + ' 天。');
      }
      if (sess.stones.length && Math.random() < 0.3) {
        const lost = sess.stones.pop();
        extra.push('一顆 ' + lost.kg + 'kg 的料被埋回土裡。');
      }
    } else if (Math.random() < 0.25) {
      extra.push('一夜平安，坑木在頭頂吱呀作響。');
    }

    log('😴 全隊在 ' + site.name + ' 坑道裡過夜，醒來繼續開工。', 'go');
    extra.forEach(n => log(n, n.indexOf('⚠️') === 0 ? 'bad' : ''));
    return { ok: true, notes: notes.concat(extra) };
  }

  /* ---------------- 工房：相玉與加工 ---------------- */
  function workshop(action, stoneId) {
    const st = S.stones.find(s => s.id === stoneId);
    if (!st) return { ok: false, msg: '找不到這顆料' };
    const eye = eyeSkill();

    if (action === 'candle') {
      if (!has('flashlight')) return { ok: false, msg: '需要強光手電筒' };
      if (S.supply.battery < 1) return { ok: false, msg: '沒電池了' };
      S.supply.battery--; S.equip.flashlight.dur -= 1;
      const r = J.candle(st); log('打燈 ' + J.label(st) + '：' + r.msg); return r;
    }
    if (action === 'loupe') {
      if (!has('loupe')) return { ok: false, msg: '需要十倍放大鏡' };
      const r = J.inspect(st); log('相玉 ' + J.label(st) + '：' + r.msg); return r;
    }
    if (action === 'window') {
      if (!has('grinder')) return { ok: false, msg: '需要手持磨機' };
      if (S.supply.grindwheel < 1) return { ok: false, msg: '沒有砂輪片' };
      if (st.state !== 'rough') return { ok: false, msg: '已經切開的料不用再開窗' };
      S.supply.grindwheel--; S.equip.grinder.dur -= 3;
      const r = J.openWindow(st, eye); log('開窗：' + r.msg, r.good ? 'ok' : 'warn'); return r;
    }
    if (action === 'cut') {
      if (!has('saw')) return { ok: false, msg: '需要切石機' };
      if (S.supply.blade < 1) return { ok: false, msg: '沒有切割片' };
      if (st.state !== 'rough') return { ok: false, msg: '已經切開了' };
      S.supply.blade--; S.equip.saw.dur -= 5;
      const est = J.estimate(st, eye);
      const r = J.cutOpen(st, eye);
      const v = J.trueValue(st);
      const win = v > est.mid * 1.15, lose = v < est.mid * 0.6;
      log('🔪 一刀切開 ' + st.siteName + '料 ' + st.kg + 'kg：' + r.msg +
        '　實價 ' + money(v) + '（切前估 ' + money(est.mid) + '）' +
        (win ? ' — 漲了！' : lose ? ' — 垮了。' : ''), win ? 'ok' : lose ? 'bad' : '');
      S.rep += win ? 2 : 0;
      return Object.assign(r, { value: v, est: est.mid, win, lose });
    }
    if (action === 'polish') {
      if (!has('polisher')) return { ok: false, msg: '需要拋光機' };
      if (st.state !== 'open') return { ok: false, msg: '只有切開的明料能拋光' };
      if (S.supply.grindwheel < 1) return { ok: false, msg: '沒有砂輪片' };
      S.supply.grindwheel--; S.equip.polisher.dur -= 2;
      const r = J.polish(st); log('拋光 ' + J.label(st) + '，售價 +30%'); return r;
    }
    return { ok: false, msg: '未知動作' };
  }

  /* ---------------- 市場 ---------------- */
  const BUYER_NAMES = ['瑞豐玉行', '老陳', '緬商吳先生', '廣東客', '台北盤商', '香港藏家', '雲南阿姐', '直播間王總'];
  const PREFS = [
    { id: 'bing', name: '愛冰種以上', test: s => s.zhong >= 4, mult: 1.35 },
    { id: 'green', name: '只認陽綠', test: s => s.color >= 10, mult: 1.45 },
    { id: 'big', name: '收大料', test: s => s.kg >= 8, mult: 1.3 },
    { id: 'rough', name: '專賭原石', test: s => s.state === 'rough', mult: 1.2 },
    { id: 'fine', name: '要成品', test: s => s.state === 'polished', mult: 1.4 },
    { id: 'purple', name: '找紫羅蘭', test: s => s.color === 9, mult: 1.5 }
  ];

  function rollBuyers() {
    S.buyers = [];
    const used = {};
    for (let i = 0; i < 3; i++) {
      let n; do { n = BUYER_NAMES[Math.floor(Math.random() * BUYER_NAMES.length)]; } while (used[n]);
      used[n] = 1;
      const pref = PREFS[Math.floor(Math.random() * PREFS.length)];
      S.buyers.push({
        name: n, pref,
        base: 0.6 + Math.random() * 0.3,             // 出價基準
        seed: Math.random(),
        haggle: 0.06 + Math.random() * 0.1
      });
    }
  }

  function offerFor(st, buyer) {
    const eye = eyeSkill();
    let base;
    if (st.state === 'rough') {
      // 玉商也是賭，他用自己的眼力估，並打賭性折扣
      const est = J.estimate(st, 4 + buyer.seed * 4);
      const risk = 0.45 + J.knownRatio(st) * 0.4;
      base = est.mid * risk;
    } else {
      base = J.trueValue(st) * 0.92;
    }
    let m = buyer.base * S.market;
    if (buyer.pref.test(st)) m *= buyer.pref.mult;
    m *= 1 + Math.min(0.25, S.rep * 0.004);          // 名聲
    if (has('scale')) m *= 1.08;                      // 過磅精準，殺價空間小
    if (S.workers.some(w => w.mutant)) m *= 0.92;     // 「那個礦場不乾淨」的傳聞
    m = Math.min(m, st.state === 'rough' ? 1.6 : 1.12); // 玉商不會做賠本生意
    return Math.max(300, Math.round(base * m));
  }

  function sell(stoneId, buyerIdx) {
    const i = S.stones.findIndex(s => s.id === stoneId);
    if (i < 0) return { ok: false, msg: '找不到料' };
    const st = S.stones[i];
    const buyer = S.buyers[buyerIdx];
    const price = offerFor(st, buyer);
    S.money += price;
    S.stats.sold++; S.stats.revenue += price;
    S.stats.bestSale = Math.max(S.stats.bestSale, price);
    S.rep += price > 500000 ? 6 : price > 100000 ? 3 : price > 20000 ? 1 : 0;
    S.stones.splice(i, 1);
    log('💰 賣給 ' + buyer.name + '：' + J.label(st) + ' → ' + money(price), 'ok');
    return { ok: true, price };
  }

  function auctionReady() { return S.day - S.lastAuction >= 7; }

  function auction(stoneIds) {
    if (!auctionReady()) return { ok: false, msg: '公盤每 7 天一次，還沒到。' };
    if (!stoneIds.length) return { ok: false, msg: '沒有投標的料' };
    let total = 0; const lines = [];
    stoneIds.forEach(id => {
      const i = S.stones.findIndex(s => s.id === id);
      if (i < 0) return;
      const st = S.stones[i];
      // 三口暗標取最高
      let best = 0;
      for (let k = 0; k < 3; k++) {
        const b = { base: 0.7 + Math.random() * 0.45, seed: Math.random(), pref: PREFS[Math.floor(Math.random() * PREFS.length)] };
        best = Math.max(best, offerFor(st, b));
      }
      const net = Math.round(best * 0.9); // 10% 公盤手續費
      total += net;
      lines.push(J.label(st) + ' → ' + money(net));
      S.stones.splice(i, 1);
      S.stats.sold++;
    });
    S.money += total; S.stats.revenue += total;
    S.lastAuction = S.day;
    S.rep += 4;
    log('🏛 公盤開標，' + lines.length + ' 件成交，淨收 ' + money(total), 'ok');
    return { ok: true, total, lines };
  }

  /* ---------------- 變異血清 ---------------- */
  function injectSerum(id) {
    const w = S.workers.find(x => x.id === id);
    if (!w) return { ok: false, msg: '人不在' };
    if (w.mutant) return { ok: false, msg: '已經變異了' };
    if ((S.supply.serum || 0) < 1) return { ok: false, msg: '沒有血清 — 補給站的黑市貨架有' };
    S.supply.serum--;
    w.mutant = true;
    w.mutDays = 6 + Math.floor(Math.random() * 5);
    w.skill.mine += 6;
    w.skill.eye = 0;
    w.maxStam = Math.round(w.maxStam * 2.5);
    w.stam = w.maxStam;
    w.morale = 100;
    w.wage = 0;
    S.workers.forEach(o => { if (!o.mutant) o.morale = Math.max(0, o.morale - 12); });
    S.morale = Math.max(0, S.morale - 8);
    log('🧪 你把血清扎進 ' + w.name + ' 的脖子。他抽搐、嘶吼、肌肉撐裂了衣服 — 然後安靜下來，眼神空了，只等你的命令。', 'bad');
    return { ok: true };
  }

  /* ---------------- 民兵上門：繳錢或開打 ---------------- */
  function militiaPay() {
    const n = S.pendingMilitia || 0;
    if (!n) return { ok: false };
    const fine = 250000 * n;
    S.money -= fine;
    S.rep = Math.max(0, S.rep - 15 * n);
    S.workers.forEach(w => { if (!w.mutant) w.morale = Math.max(0, w.morale - 20); });
    S.pendingMilitia = 0;
    log('民兵收了 ' + money(fine) + '，把命案壓了下來。工人看你的眼神都變了。', 'bad');
    if (S.money < -120000 && !S.over) { S.over = '破產：債主上門，礦權被收回，隊伍就地解散。'; log('💀 ' + S.over, 'bad'); }
    save();
    return { ok: true, fine };
  }

  function militiaFight() {
    const n = S.pendingMilitia || 0;
    if (!n) return { ok: false };
    if (!has('shotgun')) return { ok: false, msg: '沒有槍，拿什麼打？' };
    S.pendingMilitia = 0;
    const mutants = S.workers.filter(w => w.mutant).length;
    const chance = 0.45 + mutants * 0.08;
    if (Math.random() < chance) {
      S.warPath = (S.warPath || 0) + 1;
      S.rep = Math.max(0, S.rep - 25);
      S.stats.deaths += 2;
      log('🔥 你們在營地口跟民兵開火，把他們全撂倒了。從這一刻起，沒有回頭路了。', 'bad');
      if (S.warPath >= 2) {
        S.pendingArmy = true;
        log('山下已經在集結。這次來的，不會只是民兵。', 'bad');
      }
      save();
      return { ok: true, win: true, army: !!S.pendingArmy };
    }
    S.workers.forEach(w => { w.injury += 2; if (!w.mutant) w.morale = Math.max(0, w.morale - 25); });
    const fine = 500000 * n;
    S.money -= fine;
    log('你們打輸了，被按在地上。罰金加倍 ' + money(fine) + '，全隊掛彩。', 'bad');
    if (S.money < -120000 && !S.over) { S.over = '破產：債主上門，礦權被收回，隊伍就地解散。'; log('💀 ' + S.over, 'bad'); }
    save();
    return { ok: true, win: false, fine };
  }

  /* ---------------- 大部隊上門：最終決戰 ---------------- */
  function armyFight() {
    if (!S.pendingArmy) return { ok: false };
    S.pendingArmy = false;
    const mutants = S.workers.filter(w => w.mutant).length;
    const chance = 0.25 + mutants * 0.12;
    if (Math.random() < chance) {
      S.overKind = 'warlord';
      S.over = '警察和民兵倒在你的營地前，槍管還在冒煙。再也沒有人敢上這座山 — 從今天起，這裡沒有王法，只有你。';
      log('🏴 血玉軍閥：' + S.over, 'bad');
      save();
      return { ok: true, win: true };
    }
    S.overKind = 'dead';
    S.over = '你們被壓制在坑口，一個一個倒下。槍聲停了以後，山又安靜了。';
    log('💀 ' + S.over, 'bad');
    save();
    return { ok: true, win: false };
  }

  function armySurrender() {
    if (!S.pendingArmy) return { ok: false };
    S.pendingArmy = false;
    S.overKind = 'jail';
    S.over = '你被銬上手銬帶下山。礦權沒收、隊伍解散，山裡的傳聞很快就沒人記得了。';
    log('💀 ' + S.over, 'bad');
    save();
    return { ok: true };
  }

  /* ---------------- 買斷礦權 ---------------- */
  function buyoutPrice(siteId) {
    const site = SITES.find(x => x.id === siteId);
    return site.fee * 45;
  }

  function buyoutSite(siteId) {
    const site = SITES.find(x => x.id === siteId);
    if (!site) return { ok: false, msg: '沒有這個場口' };
    if (S.owned && S.owned[siteId]) return { ok: false, msg: '已經是你的了' };
    const cost = buyoutPrice(siteId);
    if (S.money < cost) return { ok: false, msg: '買斷要 ' + money(cost) + '，錢不夠' };
    S.money -= cost;
    S.owned = S.owned || {};

    const cost = Math.round(def.price * missing * 0.55);
    if (cost <= 0) return { ok: false, msg: '狀況良好，不用修' };
    if (S.money < cost) return { ok: false, msg: '修不起（需要 ' + money(cost) + '）' };

    if (last && last.dataset.msg === msg) {
