<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="開玉">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>開玉 — 上山採玉模擬</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <span class="logo">翡</span>
      <div>
        <h1>開玉</h1>
        <small>上山．開礦．相玉．一刀定生死</small>
      </div>
    </div>
    <div id="stats" class="stats"></div>
    <div class="topbtns">
      <button class="btn primary" data-act="endday">結束這一天 ⏭</button>
      <button class="btn ghost" data-act="fullscreen" id="fsBtn">⛶ 全螢幕</button>
      <button class="btn ghost" data-act="lockscreen" id="lockBtn">🔓 固定畫面</button>
      <button class="btn ghost" data-act="save">存檔</button>
      <button class="btn ghost danger" data-act="reset">重新開始</button>
    </div>
  </header>

  <nav id="tabs" class="tabs"></nav>

  <main id="view"></main>

  <div id="toast"></div>
  <div id="modal" class="hidden"><div class="modalbox" id="modalBox"></div></div>
</div>

<script src="js/data.js"></script>
<script src="js/jade.js"></script>
<script src="js/mine.js"></script>
<script src="js/fx.js"></script>
<script src="js/raid.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
