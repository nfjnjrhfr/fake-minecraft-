<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0e14">
<title>方塊對戰 Block Brawl</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cabinet">
    <p class="eyebrow"><span class="chip"></span>方塊對戰 ・ BLOCK BRAWL</p>

    <div id="stage">
      <canvas id="game" width="960" height="540" tabindex="0"></canvas>
    </div>

    <div class="legend">
      <span class="legend-group">
        <b>手機</b>螢幕左下搖桿移動，右下 <kbd>跳</kbd><kbd>劍</kbd><kbd>雪</kbd><kbd>磚</kbd>
      </span>
      <span class="legend-group">
        <b>鍵盤</b><kbd>A</kbd><kbd>D</kbd> 移動<kbd>W</kbd> 跳<kbd>F</kbd> 劍<kbd>G</kbd> 雪球<kbd>R</kbd> 方塊
      </span>
      <span class="legend-group">
        <b>其他</b><kbd>P</kbd> 暫停<kbd>M</kbd> 靜音<kbd>Esc</kbd> 主選單
      </span>
    </div>
  </main>

  <div id="rotate">請把手機轉成橫向 🔄</div>
  <script src="game.js"></script>
</body>
</html>
