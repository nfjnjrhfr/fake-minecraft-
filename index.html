<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fake Minecraft</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20fill='%23866043'/%3E%3Crect%20width='16'%20height='6'%20fill='%236aaa4e'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #78a7ff; }
  canvas { display: block; width: 100%; height: 100%; }
  body, button { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; }

  #crosshair {
    position: absolute; left: 50%; top: 50%; width: 20px; height: 20px;
    transform: translate(-50%, -50%); opacity: .85;
  }
  #crosshair::before, #crosshair::after {
    content: ""; position: absolute; background: #fff; box-shadow: 0 0 2px #000;
  }
  #crosshair::before { left: 9px; top: 0; width: 2px; height: 20px; }
  #crosshair::after  { top: 9px; left: 0; height: 2px; width: 20px; }

  #hotbar {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; gap: 4px; padding: 4px; border-radius: 4px;
    background: rgba(0,0,0,.35);
  }
  .slot {
    width: 48px; height: 48px; border: 2px solid rgba(255,255,255,.25);
    border-radius: 3px; background: rgba(0,0,0,.25); position: relative;
  }
  .slot.active { border-color: #fff; background: rgba(255,255,255,.18); }
  .slot canvas { width: 100%; height: 100%; image-rendering: pixelated; }
  .slot .num {
    position: absolute; left: 3px; top: 1px; font-size: 10px;
    opacity: .7; text-shadow: 1px 1px 0 #000;
  }
  #itemname {
    position: absolute; left: 50%; bottom: 74px; transform: translateX(-50%);
    text-shadow: 1px 1px 0 #000; font-size: 13px; opacity: 0; transition: opacity .3s;
  }
  #itemname.show { opacity: 1; }

  #debug {
    position: absolute; left: 8px; top: 8px; font-size: 12px; line-height: 1.5;
    text-shadow: 1px 1px 0 #000; white-space: pre;
  }

  #menu {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(12, 18, 28, .72); backdrop-filter: blur(3px); color: #fff; text-align: center;
  }
  #menu.hidden { display: none; }
  #menu .panel { max-width: 460px; padding: 8px 24px 24px; }
  #menu h1 { font-size: 34px; margin: 0 0 4px; letter-spacing: 2px; text-shadow: 3px 3px 0 #2b2b2b; }
  #menu p.sub { margin: 0 0 20px; opacity: .7; font-size: 13px; }
  #menu table { margin: 0 auto 22px; font-size: 13px; border-spacing: 14px 4px; opacity: .9; }
  #menu td.k { text-align: right; color: #ffd479; }
  #menu td.v { text-align: left; }
  #play {
    pointer-events: auto; cursor: pointer; font-size: 16px; padding: 12px 34px;
    border: 2px solid #fff; border-radius: 4px; background: #4c8a3f; color: #fff;
  }
  #play:hover { background: #5da34d; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; background: #101820; color: #fff; font-size: 15px; }
  #loading.hidden { display: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud">
  <div id="crosshair"></div>
  <div id="debug"></div>
  <div id="itemname"></div>
  <div id="hotbar"></div>
</div>

<div id="loading">Generating world&hellip;</div>

<div id="menu" class="hidden">
  <div class="panel">
    <h1>FAKE MINECRAFT</h1>
    <p class="sub">a very small voxel world</p>
    <table>
      <tr><td class="k">W A S D</td><td class="v">move</td></tr>
      <tr><td class="k">Mouse</td><td class="v">look around</td></tr>
      <tr><td class="k">Space</td><td class="v">jump / swim up / fly up</td></tr>
      <tr><td class="k">Shift</td><td class="v">sneak / fly down</td></tr>
      <tr><td class="k">F</td><td class="v">toggle flying</td></tr>
      <tr><td class="k">Left click</td><td class="v">break block</td></tr>
      <tr><td class="k">Right click</td><td class="v">place block</td></tr>
      <tr><td class="k">1&ndash;9 / scroll</td><td class="v">pick block</td></tr>
      <tr><td class="k">Esc</td><td class="v">pause</td></tr>
    </table>
    <button id="play">Play</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
